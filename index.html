<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSAT Scrub Buddy</title>
<style>
:root{
  color-scheme: light;
  --bg:#f3f4f6; --card:#ffffff; --text:#15171c; --muted:#5a606c; --line:#d9dde4; --soft:#eef1f6;
  --primary:#2456c9; --primary-ink:#ffffff; --primary-soft:#e4ecfb;
  --ok:#11703a; --ok-bg:#e1f3e8; --warn:#8a5600; --warn-bg:#fff2d3; --bad:#b42318; --bad-bg:#fde7e5;
  /* L1 colours follow the FS DSAT RCA Matrix sheet */
  --c-people:#2a78d6; --c-process:#eb6834; --c-policy:#6250d6; --c-product:#008300; --c-survey:#8a8984;
  --t-people:#cfe2f3; --t-process:#fce5cd; --t-policy:#d9d2e9; --t-product:#d9ead3; --t-survey:#efefef; --t-ink:#15171c;
  --c-ctrl:#2a78d6; --c-nc:#5f6b7a; --c-undecided:#c9ccd2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121316; --card:#1c1e22; --text:#eeeef0; --muted:#a6abb5; --line:#33363d; --soft:#262930;
    --primary:#5b8def; --primary-ink:#0d1220; --primary-soft:#1f2b44;
    --ok:#5fd18c; --ok-bg:#16301f; --warn:#f2b84b; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1b19;
    --c-people:#3987e5; --c-process:#d95926; --c-policy:#9085e9; --c-product:#0ca30c; --c-survey:#8f8e88;
    --t-people:#1d3550; --t-process:#4a2f17; --t-policy:#332b52; --t-product:#1e3a1c; --t-survey:#3a3b3e; --t-ink:#eeeef0;
    --c-ctrl:#3987e5; --c-nc:#8794a6; --c-undecided:#4a4d55;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h2{font-size:1.15rem}
h3{font-size:1rem;margin-top:14px}
p{margin:.25rem 0 .75rem}
a{color:var(--primary)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:800;font-size:1.1rem;margin-right:auto;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
@media (max-width:560px){
  header.top{position:static}
  .brand small{display:none}
  nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
  nav.tabs button{padding:0 4px;font-size:.9rem}
}
.privacy{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);font-weight:600;font-size:.92rem}
.privacy .wrap{padding-top:8px;padding-bottom:8px}
.storage-warn{background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:.9rem}
.storage-warn .wrap{padding:8px 16px}
main{padding:16px 0 130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.grow{flex:1 1 200px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.f{display:block;font-weight:600;margin:10px 0 4px}
label.f .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--primary);outline-offset:1px}
.pii-bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.pii-msg{color:var(--bad);font-size:.85rem;font-weight:600;margin-top:4px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 10px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.82rem;background:var(--soft);color:var(--text);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.ctrl{background:var(--c-ctrl);color:#fff}
.badge.nc{background:var(--c-nc);color:#fff}
.l1{display:inline-block;padding:3px 10px;border-radius:6px;font-weight:800;font-size:.78rem;letter-spacing:.02em;color:var(--t-ink);background:var(--soft);white-space:nowrap}
.l1.people{background:var(--t-people);box-shadow:inset 4px 0 var(--c-people)}
.l1.process{background:var(--t-process);box-shadow:inset 4px 0 var(--c-process)}
.l1.policy{background:var(--t-policy);box-shadow:inset 4px 0 var(--c-policy)}
.l1.product{background:var(--t-product);box-shadow:inset 4px 0 var(--c-product)}
.l1.survey{background:var(--t-survey);box-shadow:inset 4px 0 var(--c-survey)}
.notice{border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:500}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.info{background:var(--primary-soft);color:var(--text)}
.notice ul{margin:.3rem 0 0;padding-left:1.2rem}

/* progress */
.progress{margin-bottom:14px}
.pbar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-bottom:8px}
.pbar span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .2s}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps button{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;padding:4px;line-height:1.15}
.steps button b{display:block;font-size:1rem}
.steps button.done{color:var(--text);border-color:var(--primary)}
.steps button[aria-current="step"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
@media (max-width:560px){.steps button span{display:none}}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;border:2px solid var(--line);border-radius:12px;padding:12px 44px 12px 12px;cursor:pointer;background:var(--card);min-height:52px;user-select:none}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt .t{font-weight:700}
.opt .d{font-size:.88rem;color:var(--muted)}
.opt .q{font-size:.85rem;margin-top:6px;font-style:italic}
.opt .tip{position:absolute;top:8px;right:8px}
.opt.people{border-left:6px solid var(--c-people)}
.opt.process{border-left:6px solid var(--c-process)}
.opt.policy{border-left:6px solid var(--c-policy)}
.opt.product{border-left:6px solid var(--c-product)}
.opt.survey{border-left:6px solid var(--c-survey)}
.tip{width:30px;height:30px;min-width:30px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--text);font-weight:700;cursor:help;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;padding:0;vertical-align:middle}
#tipbox{position:fixed;z-index:100;max-width:320px;background:var(--text);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:.9rem;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;min-width:64px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.seg button.sel{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.seg button.sel.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.sel.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.sel.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.q-row{padding:10px 0;border-bottom:1px solid var(--line)}
.q-row:last-child{border-bottom:0}
.q-row .qt{font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.sugg button{min-height:40px;border:1px dashed var(--primary);background:var(--primary-soft);color:var(--text);border-radius:10px;padding:6px 10px;font:inherit;font-size:.88rem;cursor:pointer;text-align:left}

/* tracker block */
.tracker{display:grid;grid-template-columns:minmax(150px,auto) 1fr auto;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.tracker > div{padding:9px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:46px}
.tracker > div:nth-last-child(-n+3){border-bottom:0}
.tracker .k{background:var(--soft);font-weight:700;font-size:.88rem}
.tracker .v{font-weight:600;overflow-wrap:anywhere}
@media (max-width:560px){.tracker{grid-template-columns:1fr auto}.tracker .k{grid-column:1 / -1;min-height:auto;padding:6px 10px}}

/* verification */
.vstep{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.vstep .vname{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.vstep .ts{width:110px}
.result-big{font-size:1.25rem;font-weight:800;padding:12px 14px;border-radius:12px;margin-bottom:12px}
.result-big.ok{background:var(--ok-bg);color:var(--ok)}
.result-big.warn{background:var(--warn-bg);color:var(--warn)}
.result-big.bad{background:var(--bad-bg);color:var(--bad)}
.result-big.none{background:var(--soft);color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--text);font:inherit;font-size:.92rem;cursor:pointer}
.chip.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip.pos{border-color:var(--ok)}
.chip.pos.sel{background:var(--ok);border-color:var(--ok);color:#fff}

/* timeline */
.ev{display:grid;grid-template-columns:92px 1fr;gap:8px 10px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;align-items:start}
.ev.pos{border-left:5px solid var(--ok)}
.ev.neg{border-left:5px solid var(--bad)}
.ev .evbody{display:grid;gap:6px;min-width:0}
.ev .evctl{display:flex;gap:8px;flex-wrap:wrap}
.ev .evctl select{flex:1 1 200px;width:auto;min-width:0}
.evlbl{font-weight:600}
.chk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;margin-bottom:6px}
.chk .box{width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.chk.on{border-color:var(--primary);background:var(--primary-soft)}
.chk.on .box{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chk .match{font-size:.78rem;font-weight:700;color:var(--ok)}

.act{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.act .grid2{gap:8px}
.summary{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem;min-height:300px;white-space:pre-wrap}

.wfoot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:15}
.wfoot .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;align-items:center;flex-wrap:wrap}
.wfoot .sp{flex:1}
#piiBar{width:100%}
#piiBar:empty{display:none}
.show-sm{display:none}
@media (max-width:560px){
  .wfoot .sp{display:none}
  .wfoot .btn{flex:1 1 0;min-width:0;padding:0 6px;font-size:.92rem}
  .hide-sm{display:none}.show-sm{display:inline}
}

.hist{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.hist .hh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.hist .hc{color:var(--muted);font-size:.92rem;margin-bottom:8px;overflow-wrap:anywhere}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.tile .n{font-size:1.7rem;font-weight:800;line-height:1.1}
.tile .l{color:var(--muted);font-size:.85rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--text);font-family:inherit}
svg .val{fill:var(--muted)}
svg .axis{stroke:var(--line)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
.alert-card{border-color:var(--bad)}
.overdue{color:var(--bad);font-weight:700}

.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.srow input[type=text]{flex:1 1 180px;width:auto}
.srow .crit{display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600;cursor:pointer}
.srow .crit input{width:22px;height:22px}
.fwrow{display:grid;grid-template-columns:150px 200px 1fr 150px auto;gap:6px;margin-bottom:6px;align-items:center}
.fwrow input,.fwrow select{min-height:40px;padding:6px 8px;font-size:.9rem}
@media (max-width:760px){.fwrow{grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;padding:8px}.fwrow .l3{grid-column:1 / -1}}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;display:none;max-width:90vw;text-align:center}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.whys input{margin-bottom:6px}
.sr{position:absolute;left:-9999px}
@media print{header.top,.wfoot,.privacy{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">DSAT Scrub Buddy<small>Offline. No audio. Nothing leaves this device.</small></div>
    <nav class="tabs" aria-label="Main">
      <button data-act="view" data-v="scrub">Scrub</button>
      <button data-act="view" data-v="history">History</button>
      <button data-act="view" data-v="dashboard">Dashboard</button>
      <button data-act="view" data-v="settings">Settings</button>
    </nav>
  </div>
</header>
<div class="privacy" role="note"><div class="wrap">&#9888; Do not enter customer names, account numbers or personal info.</div></div>
<div id="storageWarn" class="storage-warn" hidden><div class="wrap">Browser storage is blocked here, so your data will not be kept after you close this page. Use Settings &rarr; Export JSON backup to keep your work.</div></div>
<main><div class="wrap" id="app"></div></main>
<div id="foot"></div>
<div id="tipbox" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= Constants ================= */
const APP = 'DSAT Scrub Buddy';
const LS_DB = 'dsatScrubBuddy.db.v2';
const LS_CUR = 'dsatScrubBuddy.current.v2';
const OLD_DB = 'dsatScrub.db.v1', OLD_CUR = 'dsatScrub.current.v1';
const FW_NAME = 'FS DSAT RCA Matrix v2.0';
/* Exact text of the "Framework" sheet in FS_DSAT_RCA_Matrix_v2.0.xlsx: L1 -> L2 -> [L3]. L4 = Controllable for PEOPLE, Non Controllable otherwise. */
const FW_SOURCE = {"PEOPLE":{"Issue Identification":["Asked irrelevant or insufficient probing questions, resulting in misidentification of the customer's issue","Failed to confirm understanding of the customer's issue","Failed to accurately identify the customer's issue","Failed to review case history or conversation context","Placed unnecessary effort or burden on the customer"],"Investigation Quality":["Investigation was incomplete or insufficient","Investigation delayed resolution unnecessarily","Failed to gather relevant information before proceeding","Misinterpreted available information resulting in incorrect case handling"],"Issue Resolution":["Provided inaccurate information that did not resolve the issue","Provided incomplete information that did not resolve the issue","Provided an overly complex or unnecessary explanation","Failed to provide sufficient context to support the resolution","Responses lacked authenticity or ownership","Case handling was not compliant with privacy or security requirements"],"Process Adherence":["Failed to follow established process requirements","Case should have been escalated or transferred","Unnecessary escalation","Unnecessary transfer to another team","Incorrect escalation delayed resolution","Incorrect case tagging delayed or prevented resolution","Failed to complete or request authentication when appropriate","Failed to follow call workflow requirements","Failed to follow chat workflow requirements","Missed SLA due to advocate actions"],"Communication & Professionalism":["Failed to set or manage expectations appropriately","Tone was inappropriate for the situation","Lack of empathy","Could have demonstrated greater professionalism","Lack of clarity in communication","Information overload","Excessive grammar or spelling errors","Excessive sentence structure issues","Insufficient personalization of responses","Failed to demonstrate understanding of the customer's situation","Acted in an unprofessional manner"],"Capability & Knowledge":["Acted on incorrect guidance provided by the Escalation Team","Unfamiliar with the required process or workflow"]},"PROCESS":{"Support Tools":["CSAT survey was attributed to the incorrect case","Outbound call connectivity issues"],"Third Party":["Dissatisfied with required coordination or dependency on a third party","Dissatisfied with a third-party product, process, or policy"],"Speed":["Response was within SLA, but resolution speed did not meet expectations","Response exceeded SLA expectations","Multiple case handoffs resulted in a poor support experience"],"Contact Channel":["Preferred contact channel is not supported","Support is unavailable in the preferred language","Expected a phone call, but the case was not eligible for callback support"],"Workflow":["Workflow is documented but unclear or difficult to follow","Workflow is not documented","Documented workflow was followed but was not optimal for the customer experience"],"Content":["Documented guidance was difficult for advocate to locate","Topic is not covered in the knowledge base (KA, QRG, STAR IQ)"],"Safety":["Dissatisfied with the dispute handling process","Dissatisfied with the dispute withdrawal process"],"Unable to assist End-customer":["Unable to assist with unauthorized or unrecognized charge claims due to process limitations","Unable to discuss or act on an account not owned by the requester"],"Training":["Topic should be covered in training but currently is not"],"Other":["Unable to proceed due to lack of response or required information"]},"POLICY":{"Account Policy":["Unable to assist in Account closure/cancellation"],"Email Policy":["Did not receive an expected email notification","Dissatisfied with the quality, timeliness, or content of email notifications"],"Pricing Policy":["Dissatisfied with dispute or refund fees","Dissatisfied with account servicing or transaction fees","Dissatisfied with chargeback fees","Expected a fee waiver, discount, or exception"],"Privacy & Security Policy":["Dissatisfied with authentication or verification requirements","Information could not be disclosed due to privacy or security requirements","Unable to complete authentication requirements"],"Risk Policy":["Dissatisfied with the handling of negative balances or overdraft-related activities","Dissatisfied with dispute eligibility, outcome, or handling requirements","Dissatisfied with a declined request, restriction, or compliance-driven decision","Dissatisfied with identity verification requirements"],"Tax & Legal Advice":["Support unable to provide tax or legal advice"]},"PRODUCT":{"Feature":["Missing feature or functionality","Dissatisfied with an existing feature or product capability"],"Global Availability":["Product or service is not available in the requested country or region"],"Flagstar Outage":["Product defect, incident, or service degradation impacted the user experience"],"Complexity":["Product requires knowledge or skills beyond the customer's technical proficiency","Dissatisfied with the complexity of the product or customer experience"]},"SURVEY VALIDATION":{"Incongruent Survey":["Positive interaction received an unintended negative survey","Survey comments contradict survey rating"]}};
const CTRL = 'Controllable', NCTRL = 'Non Controllable';
const H_L1 = 'Primary Driver (L1)', H_L2 = 'Root Cause Category (L2)', H_L3 = 'Root Cause Detail (L3)', H_L4 = 'Controlability (L4)';
const STEP_NAMES = ['Call info','Verification','Timeline','RCA','Action plan','Summary'];
const VSTATUS = [
  {k:'done',  label:'Done',         cls:'ok'},
  {k:'missed',label:'Missed',       cls:'bad'},
  {k:'late',  label:'Done late',    cls:'warn'},
  {k:'order', label:'Out of order', cls:'warn'}
];
const VLABEL = {done:'done', missed:'missed', late:'done late', order:'out of order'};
const K = (l1, l2, l3) => l1 + '|' + l2 + '|' + l3;
const AUTH_KEY = K('PEOPLE','Process Adherence','Failed to complete or request authentication when appropriate');
const CHIPS = [
  {label:'Long hold no check-back', tag:K('PEOPLE','Communication & Professionalism','Failed to set or manage expectations appropriately')},
  {label:'Dead air', tag:K('PEOPLE','Communication & Professionalism','Could have demonstrated greater professionalism')},

  const blob = new Blob([text], {type: type || 'text/plain'});
  const a = document.createElement('a');

function copyText(text, label){
  const msg = (label || 'Copied') + ' to clipboard';
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
    ta.remove(); toast(ok ? msg : 'Copy failed: select the text and copy it manually');
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast(msg), fallback);
  else fallback();
}

/* ================= Logic ================= */
function verifResult(s){
  const v = s.verif || [];
  if (!v.length) return {code:'N/A', cls:'none', label:'No verification steps set', issues:[], unmarked:[]};
  const issues = v.filter(x => x.status && x.status !== 'done');
  const unmarked = v.filter(x => !x.status);
  if (v.some(x => x.critical && x.status === 'missed')) return {code:'FAIL', cls:'bad', label:'Compliance fail', issues, unmarked};
  if (unmarked.length) return {code:'INCOMPLETE', cls:'none', label: unmarked.length + ' step(s) not checked yet', issues, unmarked};
  if (issues.length) return {code:'PARTIAL', cls:'warn', label:'Partial: some steps late, out of order or missed (non-critical)', issues, unmarked};
  return {code:'PASS', cls:'ok', label:'All verification steps done', issues, unmarked};
}
function verifDetail(s){
  const r = verifResult(s);
  if (r.code === 'N/A') return 'no steps set';
  const parts = r.issues.map(x => x.name + (x.critical ? ' [critical]' : '') + ' ' + VLABEL[x.status] + (x.ts ? ' @' + x.ts : ''));
  if (r.unmarked.length) parts.push(r.unmarked.length + ' not checked');
  return parts.length ? parts.join('; ') : 'all steps done';
}
const hasVerifMiss = s => (s.verif || []).some(x => x.status === 'missed');
function gate1(s){
  const r = s.rca;

function summaryText(s){
  const L = [], r = s.rca, g = gate1(s), v = verifResult(s), p = primaryCause(s), c = secondaryCause(s);
  L.push('Call ref: ' + (s.callRef || '-') + ' | Advocate: ' + (s.advocate || '-') + ' | Date: ' + (s.date || '-') + (s.callLength ? ' | Length: ' + s.callLength : ''));

  if (g.state === 'valid') L.push('Secondary: ' + (c ? c.l1 + ' > ' + c.l2 + ' > ' + c.l3 + ' (' + c.l4 + ')' + (c.lens ? ' [' + c.lens + ']' : '') + (c.explain ? ' - ' + c.explain : '') : 'None'));

      '<div class="evbody"><div class="evlbl">' + (ev.chip ? esc(ev.chip) : '') + (ev.positive ? ' <span class="badge ok">Positive</span>' : (ev.tag ? ' ' + l1Badge(t.l1) : '')) + '</div>' +

function ynRow(key, val){

  return '<div class="q-row"><div class="qt">' + esc(q.text) + ' ' + tipBtn(q.tip, q.text) + '</div><div class="seg" role="group">' +

}
function evidenceList(slot, list, cause){
  if (!cur.events.length) return '<div class="notice warn">No timeline events yet. <button class="btn sm" data-act="goto" data-v="3">Add events in Step 3</button></div>';
  return sortedEvents(cur).map(e => {
    const on = list.includes(e.id), t = parseKey(e.tag);
    const match = cause && cause.l2 && t.l1 === cause.l1 && t.l2 === cause.l2 ? (t.l3 === cause.l3 ? 'matches L3' : 'matches L2') : '';
    return '<button class="chk' + (on ? ' on' : '') + '" data-act="evid" data-i="' + slot + '" data-id="' + e.id + '" aria-pressed="' + on + '"><span class="box">' + (on ? '&#10003;' : '') + '</span><span><b>' + esc(e.ts) + '</b> ' + esc(evLabel(e)) +
      (e.positive ? ' <span class="muted small">[positive]</span>' : '') + (match ? ' <span class="match">&#9679; ' + match + '</span>' : '') + (e.tag ? '<br><span class="muted small">' + esc(tagShort(e.tag)) + '</span>' : '') + '</span></button>';
  }).join('');
}
function causePicker(slot, side){
  const r = cur.rca, c = r[slot], allowed = allowedL1(side), lensKey = slot + 'Lens';
  let h = '';
  // suggestions from timeline tags
  const tally = {};
  cur.events.forEach(e => { if (!e.positive && e.tag && findRow(e.tag) && allowed.includes(parseKey(e.tag).l1)) tally[e.tag] = (tally[e.tag] || 0) + 1; });
  const top = Object.entries(tally).sort((a,b) => b[1] - a[1]).slice(0, 3);
  if (top.length) h += '<div class="small muted">Suggested from your timeline tags:</div><div class="sugg">' + top.map(([k,n]) => { const p = parseKey(k); return '<button data-act="useTag" data-i="' + slot + '" data-v="' + esc(k) + '">' + (k === keyOf(c) ? '&#10003; ' : 'Use: ') + esc(p.l1 + ' > ' + p.l2 + ' > ' + p.l3) + ' <b>(' + n + ')</b></button>'; }).join('') + '</div>';
  if (allowed.length === 1 && c.l1 !== allowed[0]) { c.l1 = allowed[0]; c.l2 = ''; c.l3 = ''; }
  if (allowed.length > 1) {
    h += '<h3>' + H_L1 + '</h3><div class="opts">' + allowed.map(l1 => optCard('pickL1', l1, c.l1 === l1, l1, l2List(l1).length + ' categories', (L1_INFO[l1] || {}).tip || 'Primary driver from your framework.', '', l1Cls(l1), slot)).join('') + '</div>';
  }
  if (c.l1) {
    h += '<h3>' + H_L2 + '</h3><div class="opts">' + l2List(c.l1).map(l2 => optCard('pickL2', l2, c.l2 === l2, l2, '', l2Tip(l2), l2Ask(l2) ? '<div class="q">Ask: ' + esc(l2Ask(l2)) + '</div>' : '', l1Cls(c.l1), slot)).join('') + '</div>';
  }
  if (c.l1 && c.l2) {
    h += '<h3>' + H_L3 + '</h3><div class="opts one">' + l3List(c.l1, c.l2).map(row => optCard('pickL3', row.l3, c.l3 === row.l3, row.l3, row.l4, c.l1 + ' > ' + c.l2 + ' (' + row.l4 + '). ' + l2Tip(c.l2), '', '', slot)).join('') + '</div>';
  }
  if (causeDone(c)) {
    h += '<div class="notice ok" style="color:var(--text)">Tracker: ' + l1Badge(c.l1) + ' &gt; <b>' + esc(c.l2) + '</b> &gt; ' + esc(c.l3) + ' ' + l4Badge(l4For(c)) + '</div>';
  }
  if (c.l1 === 'PEOPLE') {

      LENS.map(l => optCard('pickLens', l.k, r[lensKey] === l.k, l.k, l.d, l.tip, '<div class="q">Ask: ' + esc(l.q) + '</div>', '', slot)).join('') + '</div>';
  }
  return h;
}
function step4(){

  return h;
}

function hbar(items, title){

  items.forEach((it, i) => {
    const y = i * rowH + 2, w = it.value ? Math.max(4, it.value / max * barMax) : 0;
    const lab = it.label.length > 50 ? it.label.slice(0, 49) + '...' : it.label;
    s += '<g><title>' + esc(it.label + ': ' + it.value + (it.note ? ' (' + it.note + ')' : '')) + '</title>' +
      '<rect x="0" y="' + y + '" width="' + W + '" height="' + (rowH - 2) + '" fill="transparent"/>' +
      '<text x="0" y="' + (y + 13) + '" font-size="12">' + esc(lab) + '</text>' +
      (w ? '<rect x="0" y="' + (y + 19) + '" width="' + w.toFixed(1) + '" height="16" rx="4" style="fill:' + it.color + '"/>' : '') +
      '<text class="val" x="' + (w + 6) + '" y="' + (y + 32) + '" font-size="12">' + it.value + (it.note ? ' (' + esc(it.note) + ')' : '') + '</text></g>';
  });
  return s + '</svg>';
}

function repeatAlerts(){
  const since = addDays(today(), -13), map = {};

  Object.entries(map).forEach(([k, set]) => { if (set.size >= 3) alerts.push({k, advs:[...set]}); else if (set.size === 2) watch.push({k, advs:[...set]}); });
  return {alerts, watch};
}

    }).join('') + '</tbody></table></div></div>';

  if (f.adv) {
    const mine = list.slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    h += '<div class="card"><h2>' + esc(f.adv) + ': scrubs</h2>' + mine.map(s => '<div class="hist"><div class="hh"><b>' + esc(s.date) + '</b> <span class="muted">' + esc(s.callRef) + '</span>' + verifBadge(s) + '</div><div class="hh">' + rcaBadges(s) + '</div><div class="hc">' + esc((s.comment || '').slice(0, 140)) + '</div><button class="btn sm" data-act="editScrub" data-id="' + s.id + '">Open</button></div>').join('') + '</div>';

  return h;
}

/* ================= Path helpers ================= */
function setPath(obj, path, val){
  const p = path.split('.'); let o = obj;
  for (let i = 0; i < p.length - 1; i++) { o = o[/^\d+$/.test(p[i]) ? +p[i] : p[i]]; if (o == null) return; }
  const last = p[p.length - 1];
  o[/^\d+$/.test(last) ? +last : last] = val;
}
function markPII(el){
  const bad = hasPII(el.value);
  el.classList.toggle('pii-bad', bad);
  const n = el.nextElementSibling, hasMsg = n && n.classList.contains('pii-msg');
  if (bad && !hasMsg) el.insertAdjacentHTML('afterend', piiMsgHTML);
  if (!bad && hasMsg) n.remove();
  return bad;
}

/* ================= Navigation & save ================= */
function goStep(n){
  n = Math.max(1, Math.min(6, n));
  if (n === 5 && step <= 4 && step4Errors(cur).length) {
    step = 4; ui.showErr = true; render();
    const e = $('#s4err'); if (e) e.scrollIntoView({block:'center'});
    toast('Finish the RCA first (see the list)');
    return;
  }
  ui.showErr = false; step = n; render(); window.scrollTo(0, 0); saveCur();
}
function setView(v){ view = v; ui.fwMsg = ''; render(); window.scrollTo(0, 0); }
function commitScrub(status){
  const bad = piiScan(cur);
  if (bad.length) { toast('Saving blocked: remove 6+ digit numbers from ' + bad.join(', '), 4500); updatePiiBar(); return false; }
  if (status === 'complete') {
    const errs = step1Errors(cur).concat(step4Errors(cur));
    if (errs.length) { ui.showErr = true; render(); toast('Not finished yet - see the list at the top', 3500); window.scrollTo(0, 0); return false; }
    ensureActions(cur);
  }
  cur.status = status; cur.updatedAt = new Date().toISOString();
  const i = DB.scrubs.findIndex(s => s.id === cur.id);
  if (i >= 0) DB.scrubs[i] = clone(cur); else DB.scrubs.push(clone(cur));
  saveDB(); dirty = false; saveCur(); render();
  toast(status === 'complete' ? 'Scrub saved. Copy L1-L4 into your tracker.' : 'Draft saved', 3000);
  return true;
}
function startNew(force){
  if (!force && dirty && !confirm('Discard unsaved changes to the current scrub?')) return;
  cur = newScrub(); step = 1; dirty = false; ui.addingAdv = false; ui.ev = {ts:'', chip:'', note:'', tag:''}; ui.evErr = ''; ui.showErr = false;
  lsDel(LS_CUR); view = 'scrub'; render(); window.scrollTo(0, 0);
}

function csvCell(v){
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCSV(){
  const head = LOG_COLS.concat(['Open actions','Status','Sample','Created','Updated','ID']);
  const rows = DB.scrubs.slice().sort((a,b) => (a.date || '').localeCompare(b.date || '')).map(s => logRow(s).concat([s.actions.filter(a => a.status !== 'Done').length, s.status, s.sample ? 'Yes' : '', s.createdAt, s.updatedAt, s.id]));
  const csv = '﻿' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
  download('dsat-scrub-buddy-' + today() + '.csv', csv, 'text/csv;charset=utf-8');

function exportJSON(){
  const data = {app:APP, version:2, exportedAt:new Date().toISOString(), settings:DB.settings, scrubs:DB.scrubs};
  download('dsat-scrub-buddy-backup-' + today() + '.json', JSON.stringify(data, null, 2), 'application/json');

let importMode = 'merge';
function handleImport(file){
  const rd = new FileReader();
  rd.onload = () => {
    let o;
    try { o = JSON.parse(rd.result); } catch(e) { toast('That file is not valid JSON', 3500); return; }
    if (!o || !Array.isArray(o.scrubs)) { toast('Not a DSAT Scrub Buddy backup (no scrubs found)', 3500); return; }
    let settings, scrubs;
    if (o.app === 'DSAT Scrub Assistant' || o.version === 1) { const m = migrateV1(o); settings = m.settings; scrubs = m.scrubs; }
    else { settings = normSettings(o.settings); scrubs = o.scrubs.map(normScrub); }
    if (importMode === 'replace') {
      if (!confirm('Replace ALL current data with this backup (' + scrubs.length + ' scrubs)?')) return;
      DB = {app:APP, version:2, settings, scrubs};
      saveDB(); render(); toast('Backup restored (' + scrubs.length + ' scrubs)'); return;
    }
    let added = 0, updated = 0;
    scrubs.forEach(s => { const i = DB.scrubs.findIndex(x => x.id === s.id); if (i >= 0) { DB.scrubs[i] = s; updated++; } else { DB.scrubs.push(s); added++; } });
    settings.advocates.forEach(a => { if (!DB.settings.advocates.includes(a)) DB.settings.advocates.push(a); });
    saveDB(); render(); toast('Imported: ' + added + ' new, ' + updated + ' updated');
  };
  rd.readAsText(file);
}
function parseFwPaste(text){
  const rows = [];
  String(text || '').split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const c = line.split('\t').map(x => x.trim());
    if (c.length < 3) return;
    if (/^(L1|Primary Driver)/i.test(c[0])) return; // header
    const l1 = c[0].toUpperCase(), l4raw = (c[3] || '').toLowerCase();
    const l4 = l4raw.startsWith('non') ? NCTRL : l4raw.startsWith('contr') ? CTRL : (l1 === 'PEOPLE' ? CTRL : NCTRL);
    if (c[0] && c[1] && c[2]) rows.push({l1, l2:c[1], l3:c[2], l4});
  });
  return rows;
}

  return [a, b, c];
}
function loadSamples(){
  DB.scrubs = DB.scrubs.filter(s => !s.sample).concat(makeSamples());
  ['Sample Advocate A','Sample Advocate B','Sample Advocate C'].forEach(n => { if (!DB.settings.advocates.includes(n)) DB.settings.advocates.push(n); });
  saveDB(); render(); toast('3 sample scrubs loaded. See History and Dashboard.');
}
function clearSamples(){
  if (!confirm('Remove all sample scrubs and sample advocates?')) return;
  DB.scrubs = DB.scrubs.filter(s => !s.sample);
  DB.settings.advocates = DB.settings.advocates.filter(a => !/^Sample Advocate /.test(a));
  if (cur && cur.sample) { cur = newScrub(); step = 1; dirty = false; lsDel(LS_CUR); }
  saveDB(); render(); toast('Sample data cleared');
}

/* ================= Events ================= */
function setCause(slot, c){
  const r = cur.rca;
  r[slot] = {l1:c.l1 || '', l2:c.l2 || '', l3:c.l3 || ''};
  if (r[slot].l1 !== 'PEOPLE') r[slot + 'Lens'] = '';
}
document.addEventListener('click', e => {
  const tip = e.target.closest('.tip');
  if (tip) { e.preventDefault(); e.stopPropagation(); showTip(tip); return; }
  hideTip();
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, i = el.dataset.i, id = el.dataset.id;
  const r = cur && cur.rca;
  switch (act) {
    case 'view': setView(v); break;
    case 'goto': goStep(+v); break;
    case 'next':
      if (step === 4 && gate1(cur).state === 'invalid') { if (!r.invalidKey) { ui.showErr = true; render(); toast('Pick the survey validation reason'); return; } goStep(6); }
      else goStep(step + 1);
      break;
    case 'back': goStep(step === 6 && gate1(cur).state === 'invalid' ? 4 : step - 1); break;
    case 'newScrub': startNew(false); break;
    case 'dismissMig': migratedMsg = ''; render(); break;
    case 'saveDraft': commitScrub(cur.status === 'complete' ? 'complete' : 'draft'); break;
    case 'finish': commitScrub('complete'); break;
    case 'addAdv': {
      const n = ui.newAdv.trim();
      if (!n) { toast('Type a name first'); return; }
      if (hasPII(n)) { toast('Remove the 6+ digit number from the name'); return; }
      if (!DB.settings.advocates.includes(n)) { DB.settings.advocates.push(n); saveDB(); }
      cur.advocate = n; ui.addingAdv = false; ui.newAdv = ''; touch(); render(); break;
    }
    case 'cancelAdv': ui.addingAdv = false; ui.newAdv = ''; render(); break;
    case 'vstat': { const s = cur.verif[+i]; s.status = s.status === v ? '' : v; touch(); render(); break; }
    case 'allDone': cur.verif.forEach(s => s.status = 'done'); touch(); render(); break;
    case 'reloadSteps': {
      if (cur.verif.some(s => s.status) && !confirm('Reload steps from Settings? Results on renamed steps will be cleared.')) return;
      const old = {}; cur.verif.forEach(s => old[s.name] = s);
      cur.verif = DB.settings.verifSteps.map(s => ({name:s.name, critical:!!s.critical, status: old[s.name] ? old[s.name].status : '', ts: old[s.name] ? old[s.name].ts : ''}));
      touch(); render(); break;
    }
    case 'chip': {
      const c = CHIPS.find(x => x.label === v);
      if (ui.ev.chip === v) ui.ev.chip = '';
      else { ui.ev.chip = v; ui.ev.tag = c.positive ? '' : (findRow(c.tag) ? c.tag : ui.ev.tag); }
      ui.evErr = ''; render(); break;
    }
    case 'addEvent': addEvent(); break;
    case 'delEvent':
      cur.events = cur.events.filter(x => x.id !== id);
      r.pEvidence = r.pEvidence.filter(x => x !== id); r.sEvidence = r.sEvidence.filter(x => x !== id);
      touch(); render(); break;
    case 'gq': {
      r[i] = v;
      if (i === 'q1' && v === 'no') { r.q2 = ''; r.q3 = ''; }
      if (i === 'q2' && v === 'no') r.q3 = '';
      const g = gate1(cur);
      if (g.state === 'invalid') r.invalidKey = g.suggest;
      if (g.state === 'valid' && !r.g2 && hasVerifMiss(cur)) {
        r.g2 = 'yes';
        if (!causeDone(r.p) && findRow(AUTH_KEY)) setCause('p', parseKey(AUTH_KEY));
        toast('Pre-set to PEOPLE > Process Adherence because a verification step was missed', 4000);
      }
      touch(); render(); break;
    }
    case 'invalidKey': r.invalidKey = v; touch(); render(); break;
    case 'g2': {
      const prevSide = r.g2 === 'yes' ? 'people' : r.g2 === 'no' ? 'nc' : '';
      if (v === 'partly' && r.g2 !== 'partly') r.primarySide = prevSide || r.primarySide;
      r.g2 = v;
      const sd = sides(cur);
      if (!sd.p || !allowedL1(sd.p).includes(r.p.l1)) setCause('p', sd.p === 'people' ? {l1:'PEOPLE'} : {});
      if (!sd.sec || !allowedL1(sd.sec).includes(r.s.l1)) setCause('s', sd.sec === 'people' ? {l1:'PEOPLE'} : {});
      touch(); render(); break;
    }
    case 'pside': {
      if (r.primarySide !== v) {
        const oldP = {c:r.p, lens:r.pLens, ex:r.pExplain, ev:r.pEvidence};
        r.p = r.s; r.pLens = r.sLens; r.pExplain = r.sExplain; r.pEvidence = r.sEvidence;
        r.s = oldP.c; r.sLens = oldP.lens; r.sExplain = oldP.ex; r.sEvidence = oldP.ev;
        r.primarySide = v;
        const sd = sides(cur);
        if (!allowedL1(sd.p).includes(r.p.l1)) setCause('p', sd.p === 'people' ? {l1:'PEOPLE'} : {});
        if (!allowedL1(sd.sec).includes(r.s.l1)) setCause('s', sd.sec === 'people' ? {l1:'PEOPLE'} : {});
      }
      touch(); render(); break;
    }
    case 'pickL1': setCause(i, {l1:v}); touch(); render(); break;
    case 'pickL2': setCause(i, {l1:r[i].l1, l2:v}); touch(); render(); break;
    case 'pickL3': r[i].l3 = v; touch(); render(); break;
    case 'pickLens': r[i + 'Lens'] = r[i + 'Lens'] === v ? '' : v; touch(); render(); break;
    case 'useTag': {
      setCause(i, parseKey(v));
      // also link the events with that tag as evidence
      const key = i === 'p' ? 'pEvidence' : 'sEvidence';
      cur.events.forEach(e => { if (e.tag === v && !r[key].includes(e.id)) r[key].push(e.id); });
      touch(); render(); break;
    }
    case 'evid': {
      const key = i === 'p' ? 'pEvidence' : 'sEvidence';
      r[key] = r[key].includes(id) ? r[key].filter(x => x !== id) : r[key].concat(id);
      touch(); render(); break;
    }
    case 'resetActions': cur.actions = suggestActions(cur); cur.actionsKey = actionsKey(cur); touch(); render(); break;
    case 'addAction': cur.actions.push({id:uid(), role:'', cause:'', action:'', owner:'Mentor', due:addDays(today(), 7), status:'Open', auto:false, edited:true}); touch(); render(); break;
    case 'delAction': cur.actions = cur.actions.filter(a => a.id !== id); touch(); render(); break;
    case 'actStatus': cur.actions[+i].status = v; cur.actions[+i].edited = true; touch(); render(); break;
    case 'copySummary': copyText(summaryText(cur), 'Summary copied'); break;
    case 'copyCoach': copyText(coachingText(cur), 'Coaching note copied'); break;
    case 'copyTracker': copyText(trackerValues(cur).map(x => tsvCell(x[1])).join('\t'), 'L1-L4 copied'); break;
    case 'copyOne': { const tv = trackerValues(cur)[+i]; copyText(tv[1], tv[0] + ' copied'); break; }
    case 'copyRow': copyText(logRow(cur).map(tsvCell).join('\t'), 'Full row copied'); break;
    case 'regenCoach': cur.coaching = coachingDefaults(cur); touch(); render(); break;
    case 'editScrub': {
      if (dirty && cur && !confirm('Discard unsaved changes to the current scrub?')) return;
      const s = DB.scrubs.find(x => x.id === id); if (!s) return;
      cur = normScrub(clone(s)); step = 1; dirty = false; ui.showErr = false; view = 'scrub'; saveCur(); render(); window.scrollTo(0, 0); break;
    }
    case 'copyScrub': { const s = DB.scrubs.find(x => x.id === id); if (s) copyText(summaryText(s), 'Summary copied'); break; }
    case 'copyTrackerOf': { const s = DB.scrubs.find(x => x.id === id); if (!s) return; if (!primaryCause(s)) { toast('RCA not finished for this scrub'); return; } copyText(trackerValues(s).map(x => tsvCell(x[1])).join('\t'), 'L1-L4 copied'); break; }
    case 'delScrub': {
      const s = DB.scrubs.find(x => x.id === id); if (!s) return;
      if (!confirm('Delete the scrub for ' + (s.advocate || 'unknown') + ' (' + (s.callRef || s.date) + ')? This cannot be undone.')) return;
      DB.scrubs = DB.scrubs.filter(x => x.id !== id); saveDB();
      if (cur && cur.id === id) { cur = newScrub(); step = 1; dirty = false; lsDel(LS_CUR); }
      render(); toast('Scrub deleted'); break;
    }
    case 'range':
      if (v === 'clear') ui.filt = {from:'', to:'', adv:''};
      else if (v === '0') { ui.filt.from = ''; ui.filt.to = ''; }
      else { ui.filt.from = addDays(today(), -(+v - 1)); ui.filt.to = today(); }
      render(); break;
    case 'advView': ui.filt.adv = v; render(); break;
    case 'markDone': {
      const s = DB.scrubs.find(x => x.id === id); if (!s) return;
      s.actions[+i].status = 'Done'; s.actions[+i].edited = true; s.updatedAt = new Date().toISOString(); saveDB();
      if (cur && cur.id === id) cur.actions = clone(s.actions);
      render(); toast('Action marked Done'); break;
    }
    case 'exportCSV': exportCSV(); break;
    case 'exportJSON': exportJSON(); break;
    case 'importJSON': importMode = v || 'merge'; $('#importFile').value = ''; $('#importFile').click(); break;
    case 'loadSample': loadSamples(); break;
    case 'clearSample': clearSamples(); break;
    case 'clearAll':
      if (!confirm('Delete ALL scrubs and settings on this device? Export a backup first if you need one.')) return;
      if (!confirm('Are you sure? This cannot be undone.')) return;
      DB = defaultDB(); saveDB(); lsDel(LS_CUR); cur = newScrub(); step = 1; dirty = false; render(); toast('All data deleted'); break;
    case 'sAdd': {
      const arr = DB.settings[v];
      if (v === 'verifSteps') arr.push({id:uid(), name:'Step ' + (arr.length + 1), critical:false}); else arr.push('New advocate');
      saveDB(); render();
      const last = [...document.querySelectorAll('[data-sbind^="' + v + '."]')].pop(); if (last) { last.focus(); last.select(); }
      break;
    }
    case 'sDel':
      if (v === 'verifSteps' && DB.settings.verifSteps.length === 1 && !confirm('Remove the last verification step?')) return;
      DB.settings[v].splice(+i, 1); saveDB(); render(); break;
    case 'sMove': { const arr = DB.settings[v], k = +i; if (k > 0) { [arr[k-1], arr[k]] = [arr[k], arr[k-1]]; saveDB(); render(); } break; }
    case 'fwAdd': {
      const l1 = ui.fwFilter || 'PEOPLE';
      fw().push({l1, l2:'New category', l3:'New root cause detail', l4: l1 === 'PEOPLE' ? CTRL : NCTRL});
      DB.settings.frameworkName = DB.settings.frameworkName.replace(/ \(edited\)$/, '') + ' (edited)';
      ui.fwQ = ''; saveDB(); render();
      const last = [...document.querySelectorAll('[data-fw$=".l2"]')].pop(); if (last) { last.focus(); last.select(); }
      break;
    }
    case 'fwDel': {
      const row = fw()[+i]; if (!row) return;
      if (!confirm('Delete this row?\n' + row.l1 + ' > ' + row.l2 + ' > ' + row.l3)) return;
      fw().splice(+i, 1); DB.settings.frameworkName = DB.settings.frameworkName.replace(/ \(edited\)$/, '') + ' (edited)'; saveDB(); render(); break;
    }
    case 'fwReset':
      if (!confirm('Reset the RCA framework to ' + FW_NAME + ' (82 rows)? Your edits will be lost. Saved scrubs are not changed.')) return;
      DB.settings.framework = defaultFramework(); DB.settings.frameworkName = FW_NAME; saveDB(); ui.fwMsg = 'Framework reset to ' + FW_NAME + '.'; render(); break;
    case 'fwPaste': {
      const rows = parseFwPaste(ui.fwPaste);
      if (rows.length < 5) { toast('Found only ' + rows.length + ' valid rows. Copy columns A-D from the Framework sheet.', 4000); return; }
      if (rows.some(rr => hasPII(rr.l1 + rr.l2 + rr.l3))) { toast('Pasted rows contain 6+ digit numbers. Check the paste.', 4000); return; }
      if (!confirm('Replace the framework with ' + rows.length + ' pasted rows? Saved scrubs are not changed.')) return;
      DB.settings.framework = rows; DB.settings.frameworkName = (ui.fwName || '').trim() || ('Pasted framework ' + today());
      ui.fwPaste = ''; ui.fwName = ''; saveDB(); ui.fwMsg = 'Loaded ' + rows.length + ' rows as "' + DB.settings.frameworkName + '".'; render(); break;
    }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && (e.target.id === 'evNote' || e.target.id === 'evTs')) { e.preventDefault(); addEvent(); }
  if (e.key === 'Escape') hideTip();
});
function addEvent(){
  const f = ui.ev, ts = normTs(f.ts);
  if (!ts) { ui.evErr = 'Enter the time as mm:ss (for example 03:15).'; render(); const t = $('#evTs'); if (t) t.focus(); return; }
  if (!f.chip && !f.note.trim()) { ui.evErr = 'Pick a chip or type a note.'; render(); return; }
  if (hasPII(f.note)) { ui.evErr = 'Remove the 6+ digit number from the note before adding.'; render(); return; }
  const c = CHIPS.find(x => x.label === f.chip), positive = !!(c && c.positive);
  cur.events.push({id:uid(), ts, chip:f.chip, note:f.note.trim(), tag: positive ? '' : f.tag, positive});
  ui.ev = {ts:'', chip:'', note:'', tag:''}; ui.evErr = '';
  touch(); render();
  const t = $('#evTs'); if (t) t.focus();
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && cur && el.type !== 'checkbox') {
    setPath(cur, el.dataset.bind, el.value);
    if (/^actions\.\d+\./.test(el.dataset.bind)) cur.actions[+el.dataset.bind.split('.')[1]].edited = true;
    if (el.type === 'text' || el.tagName === 'TEXTAREA') markPII(el);
    updatePiiBar(); touch();
    return;
  }
  if (el.dataset.ui) {
    const k = el.dataset.ui;
    if (k === 'histQ') { ui.histQ = el.value; renderHistList(); return; }
    if (k === 'fwQ') { ui.fwQ = el.value; renderFwList(); return; }
    if (k === 'fwPaste' || k === 'fwName') { ui[k] = el.value; return; }
    if (k === 'fwFilter') return;
    if (k === 'newAdv') { ui.newAdv = el.value; markPII(el); return; }
    ui.ev[k] = el.value;
    if (k === 'note') markPII(el);
    return;
  }
  if (el.dataset.sbind) {
    if (markPII(el)) return; // not persisted
    const parts = el.dataset.sbind.split('.');
    if (parts[0] === 'verifSteps') DB.settings.verifSteps[+parts[1]].name = el.value;
    else DB.settings[parts[0]][+parts[1]] = el.value;
    saveDB(); return;
  }
  if (el.dataset.fw && el.tagName === 'INPUT') {
    if (markPII(el)) return;
    const [idx, field] = el.dataset.fw.split('.');
    const row = fw()[+idx]; if (!row) return;
    row[field] = field === 'l1' ? el.value.trim().toUpperCase() : el.value.trim();
    if (!/ \(edited\)$/.test(DB.settings.frameworkName)) DB.settings.frameworkName += ' (edited)';
    saveDB();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'advSel') {
    if (el.value === '__new') { ui.addingAdv = true; render(); const n = document.querySelector('[data-ui="newAdv"]'); if (n) n.focus(); }
    else { cur.advocate = el.value; ui.addingAdv = false; touch(); render(); }
    return;
  }
  if (el.id === 'importFile') { if (el.files && el.files[0]) handleImport(el.files[0]); return; }
  if (el.dataset.bind && cur) {
    if (el.tagName === 'SELECT' || el.type === 'date') { setPath(cur, el.dataset.bind, el.value); touch(); }
    if (/\.ts$/.test(el.dataset.bind)) { const n = normTs(el.value); if (n) { el.value = n; setPath(cur, el.dataset.bind, n); touch(); } }
    if (el.dataset.rr || el.tagName === 'SELECT') render();
    return;
  }
  if (el.dataset.ui === 'tag') { ui.ev.tag = el.value; return; }
  if (el.dataset.ui === 'fwFilter') { ui.fwFilter = el.value; renderFwList(); return; }
  if (el.dataset.filt) { ui.filt[el.dataset.filt] = el.value; render(); return; }
  if (el.dataset.scheck != null) { DB.settings.verifSteps[+el.dataset.scheck].critical = el.checked; saveDB(); return; }
  if (el.dataset.fw && el.tagName === 'SELECT') { const [idx] = el.dataset.fw.split('.'); fw()[+idx].l4 = el.value; if (!/ \(edited\)$/.test(DB.settings.frameworkName)) DB.settings.frameworkName += ' (edited)'; saveDB(); return; }
  if (el.dataset.sbind) {
    if (hasPII(el.value)) { toast('Not saved: remove the 6+ digit number'); return; }
    const parts = el.dataset.sbind.split('.');
    if (parts[0] === 'advocates') { DB.settings.advocates[+parts[1]] = el.value.trim(); saveDB(); }
  }
});

/* ================= Tooltips ================= */
const tipbox = $('#tipbox');
let tipFor = null, tipShownAt = 0;
function showTip(el){
  tipFor = el; tipShownAt = Date.now();
  tipbox.textContent = el.dataset.tip;
  tipbox.style.display = 'block';
  const r = el.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;
  const left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
  tipbox.style.left = left + 'px'; tipbox.style.top = top + 'px';
}
function hideTip(){ tipbox.style.display = 'none'; tipFor = null; }
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('.tip'); if (t && t !== tipFor) showTip(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest && e.target.closest('.tip'); if (t && !t.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('tip')) showTip(e.target); });
document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('tip')) hideTip(); });
window.addEventListener('scroll', () => { if (Date.now() - tipShownAt > 400) hideTip(); }, {passive:true});
window.addEventListener('beforeunload', () => { clearTimeout(curTimer); saveCur(); });

/* ================= Boot ================= */
loadDB();
(function restore(){
  const raw = lsGet(LS_CUR);
  if (raw) { try { const o = JSON.parse(raw); cur = normScrub(o.cur); step = o.step || 1; dirty = !!o.dirty; } catch(e) { cur = null; } }
  if (!cur) cur = newScrub();
  if (!lsSet('dsatScrubBuddy.test', '1')) storageOK = false; else lsDel('dsatScrubBuddy.test');
})();
render();
</script>
