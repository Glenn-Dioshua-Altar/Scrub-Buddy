<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSAT Scrub Assistant</title>
<style>
:root{
  color-scheme: light;
  --bg:#f3f4f6; --card:#ffffff; --text:#15171c; --muted:#5a606c; --line:#d9dde4; --soft:#eef1f6;
  --primary:#2456c9; --primary-ink:#ffffff; --primary-soft:#e4ecfb;
  --ok:#11703a; --ok-bg:#e1f3e8; --warn:#8a5600; --warn-bg:#fff2d3; --bad:#b42318; --bad-bg:#fde7e5;
  --person:#2a78d6; --process:#eb6834; --nc:#8a8984; --undecided:#c9ccd2; --driver:#2a78d6;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121316; --card:#1c1e22; --text:#eeeef0; --muted:#a6abb5; --line:#33363d; --soft:#262930;
    --primary:#5b8def; --primary-ink:#0d1220; --primary-soft:#1f2b44;
    --ok:#5fd18c; --ok-bg:#16301f; --warn:#f2b84b; --warn-bg:#33270f; --bad:#ff8a80; --bad-bg:#3a1b19;
    --person:#3987e5; --process:#d95926; --nc:#8f8e88; --undecided:#4a4d55; --driver:#3987e5;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{line-height:1.25;margin:0 0 .5rem}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:.25rem 0 .75rem}
a{color:var(--primary)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;font-size:1.05rem;margin-right:auto;white-space:nowrap}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
@media (max-width:560px){
  header.top{position:static}
  .brand small{display:none}
  nav.tabs{display:grid;grid-template-columns:repeat(4,1fr);width:100%}
  nav.tabs button{padding:0 4px;font-size:.9rem}
}
.privacy{background:var(--warn-bg);color:var(--warn);border-bottom:1px solid var(--line);font-weight:600;font-size:.92rem}
.privacy .wrap{padding-top:8px;padding-bottom:8px}
.storage-warn{background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:.9rem}
.storage-warn .wrap{padding:8px 16px}
main{padding:16px 0 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.grow{flex:1 1 200px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.f{display:block;font-weight:600;margin:10px 0 4px}
label.f .hint{font-weight:400;color:var(--muted);font-size:.85rem}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,[role=button]:focus-visible{outline:3px solid var(--primary);outline-offset:1px}
.pii-bad{border-color:var(--bad)!important;background:var(--bad-bg)!important}
.pii-msg{color:var(--bad);font-size:.85rem;font-weight:600;margin-top:4px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:36px;padding:0 10px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.82rem;background:var(--soft);color:var(--text);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.person{background:var(--person);color:#fff}
.badge.process{background:var(--process);color:#fff}
.badge.nc{background:var(--nc);color:#fff}
.notice{border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:500}
.notice.ok{background:var(--ok-bg);color:var(--ok)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.notice.info{background:var(--primary-soft);color:var(--text)}
.notice ul{margin:.3rem 0 0;padding-left:1.2rem}

/* progress */
.progress{margin-bottom:14px}
.pbar{height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-bottom:8px}
.pbar span{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .2s}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps button{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:10px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;padding:4px;line-height:1.15}
.steps button b{display:block;font-size:1rem}
.steps button.done{color:var(--text);border-color:var(--primary)}
.steps button[aria-current="step"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
@media (max-width:560px){.steps button span{display:none}}

/* option cards */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:8px 0}
.opt{position:relative;border:2px solid var(--line);border-radius:12px;padding:12px 44px 12px 12px;cursor:pointer;background:var(--card);min-height:56px;user-select:none}
.opt:hover{border-color:var(--primary)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt .t{font-weight:700}
.opt .d{font-size:.88rem;color:var(--muted)}
.opt .q{font-size:.85rem;margin-top:6px;font-style:italic}
.opt .tip{position:absolute;top:8px;right:8px}
.tip{width:30px;height:30px;min-width:30px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--text);font-weight:700;cursor:help;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;padding:0;vertical-align:middle}
#tipbox{position:fixed;z-index:100;max-width:300px;background:var(--text);color:var(--bg);padding:10px 12px;border-radius:10px;font-size:.9rem;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;min-width:64px;padding:0 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.seg button.sel{border-color:var(--primary);background:var(--primary);color:var(--primary-ink)}
.seg button.sel.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.sel.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.seg button.sel.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.q-row{padding:10px 0;border-bottom:1px solid var(--line)}
.q-row:last-child{border-bottom:0}
.q-row .qt{font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center}

/* verification */
.vstep{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.vstep .vname{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.vstep .ts{width:110px}
.result-big{font-size:1.25rem;font-weight:800;padding:12px 14px;border-radius:12px;margin-bottom:12px}
.result-big.ok{background:var(--ok-bg);color:var(--ok)}
.result-big.warn{background:var(--warn-bg);color:var(--warn)}
.result-big.bad{background:var(--bad-bg);color:var(--bad)}
.result-big.none{background:var(--soft);color:var(--muted)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--text);font:inherit;font-size:.92rem;cursor:pointer}
.chip.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip.pos{border-color:var(--ok)}
.chip.pos.sel{background:var(--ok);border-color:var(--ok);color:#fff}

/* timeline */
.ev{display:grid;grid-template-columns:92px 1fr;gap:8px 10px;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;align-items:start}
.ev.pos{border-left:5px solid var(--ok)}
.ev.neg{border-left:5px solid var(--bad)}
.ev .ts{font-weight:700}
.ev .evbody{display:grid;gap:6px}
.ev .evctl{display:flex;gap:8px;flex-wrap:wrap}
.ev .evctl select{flex:1 1 160px;width:auto}
.evlbl{font-weight:600}
.chk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;margin-bottom:6px}
.chk .box{width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-weight:800}
.chk.on{border-color:var(--primary);background:var(--primary-soft)}
.chk.on .box{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}

/* actions */
.act{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.act .grid2{gap:8px}

/* summary */
.summary{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9rem;min-height:260px;white-space:pre-wrap}

/* wizard footer */
.wfoot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:15}
.wfoot .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;align-items:center;flex-wrap:wrap}
.wfoot .sp{flex:1}
#piiBar{width:100%}
#piiBar:empty{display:none}

/* history */
.hist{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.hist .hh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.hist .hc{color:var(--muted);font-size:.92rem;margin-bottom:8px;overflow-wrap:anywhere}

/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.tile .n{font-size:1.7rem;font-weight:800;line-height:1.1}
.tile .l{color:var(--muted);font-size:.85rem}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{fill:var(--text);font-family:inherit}
svg .val{fill:var(--muted)}
svg .axis{stroke:var(--line)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
.alert-card{border-color:var(--bad)}
.overdue{color:var(--bad);font-weight:700}

/* settings */
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.srow input[type=text]{flex:1 1 180px;width:auto}
.srow .crit{display:flex;align-items:center;gap:6px;min-height:44px;font-weight:600;cursor:pointer}
.srow .crit input{width:22px;height:22px}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:200;display:none;max-width:90vw;text-align:center}
details summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.whys input{margin-bottom:6px}
.sr{position:absolute;left:-9999px}
@media print{header.top,.wfoot,.privacy{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">DSAT Scrub Assistant<small>Offline. No audio. Nothing leaves this device.</small></div>
    <nav class="tabs" aria-label="Main">
      <button data-act="view" data-v="scrub">Scrub</button>
      <button data-act="view" data-v="history">History</button>
      <button data-act="view" data-v="dashboard">Dashboard</button>
      <button data-act="view" data-v="settings">Settings</button>
    </nav>
  </div>
</header>
<div class="privacy" role="note"><div class="wrap">&#9888; Do not enter customer names, account numbers or personal info.</div></div>
<div id="storageWarn" class="storage-warn" hidden><div class="wrap">Browser storage is blocked here, so your data will not be kept after you close this page. Use Settings &rarr; Export JSON backup to keep your work.</div></div>
<main><div class="wrap" id="app"></div></main>
<div id="foot"></div>
<div id="tipbox" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ================= Constants ================= */
const LS_DB = 'dsatScrub.db.v1';
const LS_CUR = 'dsatScrub.current.v1';
const STEP_NAMES = ['Call info','Verification','Timeline','RCA','Action plan','Summary'];
const VSTATUS = [
  {k:'done',  label:'Done',         cls:'ok'},
  {k:'missed',label:'Missed',       cls:'bad'},
  {k:'late',  label:'Done late',    cls:'warn'},
  {k:'order', label:'Out of order', cls:'warn'}
];
const VLABEL = {done:'done', missed:'missed', late:'done late', order:'out of order'};
const DEFAULT_DRIVERS = ['Resolution','Handle/hold time','Transfer','Tone/empathy','Policy','System','Other'];
const CHIPS = [
  {label:'Long hold no check-back', driver:'Handle/hold time'},
  {label:'Dead air', driver:'Handle/hold time'},
  {label:'Customer repeated issue', driver:'Resolution'},
  {label:'Unneeded transfer', driver:'Transfer'},
  {label:'Wrong info given', driver:'Resolution'},
  {label:'Over-promised', driver:'Resolution'},
  {label:'Interrupted customer', driver:'Tone/empathy'},
  {label:'No empathy', driver:'Tone/empathy'},
  {label:'Poor call control', driver:'Handle/hold time'},
  {label:'System slow/down', driver:'System'},
  {label:'Good handling', driver:'', positive:true}
];
const GATE1 = {
  q1:{text:'Is the survey about THIS call?', tip:'Compare the survey comment with what you hear on this recording. If the customer is talking about an earlier call, a branch visit or someone else, the survey is not about this call.'},
  q2:{text:'Is the customer rating the bank, product or policy, not the service?', tip:'Example: "Your fees are too high" or "I hate this rule" is about the bank or product, not about how the advocate handled the call.'},
  q3:{text:'Was the correct outcome given, and the customer is still unhappy?', tip:'The advocate did the right thing and gave the right answer, but the customer still scored low. This is flagged so a reviewer can double-check if the DSAT is fair.'}
};
const NC_REASONS = [
  {k:'Previous interaction', tip:'The customer is upset about an earlier call, visit or contact, not this one.'},
  {k:'Product/fee', tip:'The customer is unhappy with a bank product, rate or fee, not with the service on this call.'},
  {k:'Policy', tip:'The customer dislikes a bank rule that was applied correctly. Nothing the advocate could change.'},
  {k:'Wrong attribution', tip:'The survey was linked to the wrong advocate or the wrong call.'},
  {k:'Unrealistic expectation', tip:'The customer wanted something no one could give (for example, waiving a fee that cannot be waived).'}
];
const G2 = [
  {k:'yes', t:'Yes', d:'Person', tip:'A fully trained, motivated advocate would have avoided this DSAT. The cause is the advocate\'s knowledge, skill, behavior or tool use.'},
  {k:'no', t:'No', d:'Process', tip:'Even the best advocate would have got this DSAT. The cause is a rule, procedure, training or system.'},
  {k:'partly', t:'Partly', d:'Both (pick Primary + Secondary)', tip:'Both the advocate and the process played a part. You choose which one mattered more (Primary). The other becomes Secondary.'}
];
const TYPE_TIPS = {
  Person:'Choose Person as Primary if the advocate\'s actions mattered more than the process.',
  Process:'Choose Process as Primary if the rule, procedure, training or system mattered more than the advocate.'
};
const SUBS = {
  Person:[
    {k:'Knowledge', d:'Didn\'t know', tip:'The advocate did not know the correct process, policy or answer.', q:'Could they explain the correct process if asked?'},
    {k:'Skill', d:'Knew but couldn\'t execute', tip:'The advocate knew what to do but could not do it well live on the call (e.g. de-escalation, call control, explaining clearly).', q:'Can they explain it, but struggled to do it on the call?'},
    {k:'Behavior', d:'Knew, could, didn\'t', tip:'The advocate knew what to do and was able to do it, but did not (skipped steps, rushed, poor attitude).', q:'Have they done this correctly on other calls?'},
    {k:'Tool use', d:'Used the system wrong', tip:'The system worked, but the advocate used a screen, field or tool incorrectly.', q:'Was the system working, but they clicked or entered the wrong thing?'}
  ],
  Process:[
    {k:'Policy', d:'Customer disliked a correct rule', tip:'The advocate applied the bank rule correctly, but the customer did not like the rule itself.', q:'Would any advocate have given the same answer under the rules?'},
    {k:'Procedure gap', d:'Unclear, missing or conflicting steps', tip:'The official steps or KB were unclear, missing or contradicted each other, so there was no clear right path.', q:'If you open the KB/procedure, is the right step clearly written?'},
    {k:'Training gap', d:'Did what was taught, but training was wrong/missing', tip:'The advocate did exactly what training taught, but the training was wrong, outdated or never covered this case.', q:'Does the training material cover this case correctly?'},
    {k:'System', d:'Outage, slow system or wrong KB info', tip:'A system outage, slowness or wrong information in the KB/tool caused the problem.', q:'Would this have happened to anyone using the system at that time?'}
  ]
};
const ACTION_MAP = {
  'Knowledge':     {action:'Re-explain the correct process + quick quiz', owner:'Mentor'},
  'Skill':         {action:'Role-play + side-by-side coaching', owner:'Mentor'},
  'Behavior':      {action:'Coaching log; escalate to TL if repeated', owner:'Mentor -> TL'},
  'Tool use':      {action:'Screen walkthrough of the system/tool', owner:'Mentor'},
  'Policy':        {action:'Feedback to client / VOC report', owner:'TL'},
  'Procedure gap': {action:'KB or procedure update request', owner:'Trainer/QA'},
  'Training gap':  {action:'Training update request', owner:'Trainer/QA'},
  'System':        {action:'IT ticket + incident note', owner:'TL/IT'}
};
const OWNERS = ['Mentor','Mentor -> TL','TL','Trainer/QA','TL/IT','QA','IT'];
const TIPS = {
  'Knowledge':'Before your next shift, review the KB article for this topic and explain it back to your mentor in your own words.',
  'Skill':'Slow down and follow the call flow one step at a time. Confirm with the customer before moving to the next step.',
  'Behavior':'Do every required step on every call, even when the call feels routine. The steps protect you and the customer.',
  'Tool use':'Double-check the screen and field before you act. Keep the walkthrough notes open as a checklist.'
};

/* ================= Utils ================= */
const $ = (s, r=document) => r.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Math.random().toString(36).slice(2, 9) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const today = () => isoDate(new Date());
const addDays = (iso, n) => { const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y, m-1, d); dt.setDate(dt.getDate()+n); return isoDate(dt); };
const hasPII = v => /\d{6,}/.test(String(v || ''));
const clone = o => JSON.parse(JSON.stringify(o));
const other = t => t === 'Person' ? 'Process' : t === 'Process' ? 'Person' : '';
function normTs(v){
  v = String(v || '').trim();
  let m = v.match(/^(\d{1,3}):([0-5]\d)$/);
  if (m) return pad(+m[1]) + ':' + m[2];
  m = v.match(/^(\d{1,2}):([0-5]\d):([0-5]\d)$/);
  if (m) return (+m[1]*60 + +m[2]) + ':' + m[3];
  return null;
}
const tsSec = v => { const n = normTs(v); if (!n) return 99999; const [a,b] = n.split(':').map(Number); return a*60+b; };
function toast(msg, ms){
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = 'none', ms || 2600);
}
function download(name, text, type){
  const blob = new Blob([text], {type: type || 'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function copyText(text){
  const fallback = () => {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch(e) {}
    ta.remove(); toast(ok ? 'Copied to clipboard' : 'Copy failed: select the text and copy it manually');
  };
  if (navigator.clipboard && window.isSecureContext) {

  } else fallback();
}

/* ================= Logic ================= */
function verifResult(s){
  const v = s.verif || [];
  if (!v.length) return {code:'N/A', cls:'none', label:'No verification steps set', issues:[]};
  const issues = v.filter(x => x.status && x.status !== 'done');
  const unmarked = v.filter(x => !x.status);
  const critMiss = v.some(x => x.critical && x.status === 'missed');
  if (critMiss) return {code:'FAIL', cls:'bad', label:'Compliance fail', issues, unmarked};
  if (unmarked.length) return {code:'INCOMPLETE', cls:'none', label: unmarked.length + ' step(s) not checked yet', issues, unmarked};
  if (issues.length) return {code:'PARTIAL', cls:'warn', label:'Partial: some steps late, out of order or missed (non-critical)', issues, unmarked};
  return {code:'PASS', cls:'ok', label:'All verification steps done', issues, unmarked};
}
function verifDetail(s){
  const r = verifResult(s);
  if (r.code === 'N/A') return 'no steps set';
  const parts = r.issues.map(x => x.name + (x.critical ? ' [critical]' : '') + ' ' + VLABEL[x.status] + (x.ts ? ' @' + x.ts : ''));
  if (r.unmarked && r.unmarked.length) parts.push(r.unmarked.length + ' not checked');
  return parts.length ? parts.join('; ') : 'all steps done';
}
const hasVerifMiss = s => (s.verif || []).some(x => x.status === 'missed');
function gate1(s){
  const r = s.rca;
  if (r.q1 === 'no') return {state:'nc', why:'Survey is not about this call', suggest:'Previous interaction'};
  if (r.q1 !== 'yes') return {state:'incomplete'};
  if (r.q2 === 'yes') return {state:'nc', why:'Customer is rating the bank/product/policy, not the service', suggest:'Product/fee'};
  if (r.q2 !== 'no') return {state:'incomplete'};
  if (!r.q3) return {state:'incomplete'};
  return {state:'valid', review: r.q3 === 'yes'};
}
function causeTypes(s){
  const r = s.rca;
  const p = r.g2 === 'yes' ? 'Person' : r.g2 === 'no' ? 'Process' : r.g2 === 'partly' ? r.primaryType : '';
  const sec = r.g2 === 'partly' && p ? other(p) : '';
  return {p, sec};
}
function rcaClass(s){
  const g = gate1(s);
  if (g.state === 'nc') return 'Non-controllable';
  const {p} = causeTypes(s);
  if (g.state === 'valid' && p && s.rca.pSub) return p;
  return 'Undecided';
}
const evById = (s, id) => s.events.find(e => e.id === id);
const evLabel = e => e.chip && e.note ? e.chip + ' - ' + e.note : (e.chip || e.note || '(no note)');
const evText = e => e.ts + ' ' + evLabel(e) + (e.positive ? ' [positive]' : e.driver ? ' [' + e.driver + ']' : '');
const sortedEvents = s => s.events.slice().sort((a,b) => tsSec(a.ts) - tsSec(b.ts));
const liveEvidence = (s, list) => (list || []).filter(id => evById(s, id));

function step4Errors(s){
  const errs = [];
  const r = s.rca, g = gate1(s);
  if (g.state === 'incomplete') { errs.push('Answer the Gate 1 questions (is the DSAT valid?).'); return errs; }
  if (g.state === 'nc') { if (!r.ncReason) errs.push('Pick a Non-controllable reason.'); return errs; }
  if (!r.g2) { errs.push('Answer Gate 2 (would a fully trained, motivated advocate have avoided this DSAT?).'); return errs; }
  const {p, sec} = causeTypes(s);
  if (!p) { errs.push('Choose which cause is Primary (Person or Process).'); return errs; }
  if (!r.pSub) errs.push('Choose the Primary sub-cause.');
  if (!liveEvidence(s, r.pEvidence).length) errs.push('Evidence required: link at least one timeline timestamp to the Primary cause.');
  if (hasVerifMiss(s) && p === 'Process') {
    if (r.pSub && !['Procedure gap','System'].includes(r.pSub)) errs.push('A verification step was missed, so the Primary cause defaults to Person. Process is only allowed with Procedure gap or System plus a justification.');
    else if (!r.justification.trim()) errs.push('Write a justification for why the verification miss is a Process cause (Procedure gap or System).');
  }
  if (sec && !r.sSub) errs.push('Choose the Secondary sub-cause.');
  return errs;
}
function step1Errors(s){
  const e = [];
  if (!s.advocate) e.push('Choose the advocate (Step 1).');
  if (!s.date) e.push('Enter the call date (Step 1).');
  return e;
}
function piiFields(s){
  const f = [['Advocate name', s.advocate], ['Call reference ID', s.callRef], ['Call length', s.callLength], ['DSAT comment', s.comment]];
  s.verif.forEach(v => f.push(['Verification time (' + v.name + ')', v.ts]));
  s.events.forEach(e => { f.push(['Timeline note', e.note]); f.push(['Timeline time', e.ts]); });
  const r = s.rca;
  f.push(['Non-controllable note', r.ncNote], ['Primary explanation', r.pExplain], ['Secondary explanation', r.sExplain], ['Verification justification', r.justification]);
  r.whys.forEach((w,i) => f.push(['Why #' + (i+1), w]));
  s.actions.forEach(a => { f.push(['Action', a.action]); f.push(['Action owner', a.owner]); });
  f.push(['What went well', s.coaching.well], ['What to fix', s.coaching.fix], ['Tip for next call', s.coaching.tip]);
  return f;
}
function piiScan(s){
  const bad = [];
  piiFields(s).forEach(([l, v]) => { if (hasPII(v) && !bad.includes(l)) bad.push(l); });
  return bad;
}

function suggestActions(s){
  const {p, sec} = causeTypes(s), r = s.rca, out = [];
  const due = addDays(today(), 7);
  const add = (role, type, sub) => {
    const m = ACTION_MAP[sub]; if (!m) return;
    out.push({id: uid(), role, cause: type + ' - ' + sub, action: m.action, owner: m.owner, due, status:'Open', auto:true});
  };
  if (gate1(s).state === 'valid') {
    if (p && r.pSub) add('Primary', p, r.pSub);
    if (sec && r.sSub) add('Secondary', sec, r.sSub);
  }
  return out;
}
const actionsKey = s => { const {p, sec} = causeTypes(s); return gate1(s).state + '|' + p + '|' + s.rca.pSub + '|' + sec + '|' + s.rca.sSub; };
function ensureActions(s){
  const key = actionsKey(s);
  if (key !== s.actionsKey && !s.actions.some(a => a.edited || !a.auto)) {
    s.actions = suggestActions(s); s.actionsKey = key;
  }
}
function personCause(s){
  const {p, sec} = causeTypes(s), r = s.rca;
  if (gate1(s).state !== 'valid') return null;
  if (p === 'Person' && r.pSub) return {sub: r.pSub, explain: r.pExplain, ev: liveEvidence(s, r.pEvidence)};
  if (sec === 'Person' && r.sSub) return {sub: r.sSub, explain: r.sExplain, ev: liveEvidence(s, r.sEvidence)};
  return null;
}
function coachingDefaults(s){
  const pc = personCause(s);
  const pos = s.events.filter(e => e.positive).map(e => e.ts + ' ' + evLabel(e));
  const fixParts = [];
  if (pc) {
    if (pc.explain) fixParts.push(pc.explain);
    const ev = pc.ev.map(id => evById(s, id)).filter(Boolean).map(e => e.ts + ' ' + evLabel(e));
    if (ev.length) fixParts.push('See ' + ev.join('; '));
  }
  return {well: pos.join('; '), fix: fixParts.join('. '), tip: pc ? (TIPS[pc.sub] || '') : ''};
}
function summaryText(s){
  const L = [], r = s.rca, g = gate1(s), v = verifResult(s), {p, sec} = causeTypes(s);
  L.push('Call ref: ' + (s.callRef || '-') + ' | Advocate: ' + (s.advocate || '-') + ' | Date: ' + (s.date || '-') + (s.callLength ? ' | Length: ' + s.callLength : ''));
  L.push('DSAT: ' + (s.comment || '-'));
  if (g.state === 'nc') L.push('Valid: No (Non-controllable - ' + (r.ncReason || 'reason not chosen') + (r.ncNote ? ': ' + r.ncNote : '') + '; ' + g.why + ')');
  else if (g.state === 'valid') L.push('Valid: Yes (about this call, rating the service' + (g.review ? '; correct outcome given but customer still unhappy - FLAGGED FOR REVIEW' : '') + ')');
  else L.push('Valid: Not decided yet');
  L.push('Verification: ' + v.code + ' (' + verifDetail(s) + ')');
  let evIds = [];
  if (g.state === 'valid') {
    L.push('Primary: ' + (p ? p + ' - ' + (r.pSub || '?') + (r.pExplain ? ': ' + r.pExplain : '') : 'Not decided'));
    L.push('Secondary: ' + (sec ? sec + ' - ' + (r.sSub || '?') + (r.sExplain ? ': ' + r.sExplain : '') : 'None'));
    if (hasVerifMiss(s) && p === 'Process' && r.justification) L.push('Verification miss justification: ' + r.justification);
    evIds = liveEvidence(s, r.pEvidence).concat(liveEvidence(s, r.sEvidence).filter(id => !r.pEvidence.includes(id)));
  } else {
    evIds = s.events.map(e => e.id);
  }
  const evs = evIds.map(id => evById(s, id)).filter(Boolean).sort((a,b) => tsSec(a.ts) - tsSec(b.ts));
  L.push('Evidence: ' + (evs.length ? evs.map(evText).join('; ') : 'None'));
  const whys = r.whys.map(w => w.trim()).filter(Boolean);
  if (whys.length && g.state === 'valid') L.push('5 Whys: ' + whys.map((w,i) => (i+1) + ') ' + w).join(' '));
  L.push('Action: ' + (s.actions.length ? s.actions.map(a => (a.action || '(no action text)') + ' (' + (a.owner || 'no owner') + ', ' + (a.due || 'no due date') + (a.status === 'Done' ? ', DONE' : '') + ')').join(' | ') : 'None'));
  return L.join('\n');
}
function coachingText(s){
  const c = s.coaching, pc = personCause(s);
  return 'Coaching note - ' + (s.advocate || 'Advocate') + ' (' + (s.date || '') + (s.callRef ? ', ' + s.callRef : '') + ')' + (pc ? ' - Focus: ' + pc.sub : '') + '\n' +
    'What went well: ' + (c.well || '-') + '\n' +
    'What to fix: ' + (c.fix || '-') + '\n' +
    'Tip for next call: ' + (c.tip || '-');
}

  });
  h += '</div>';
  return h;
}

function step3(){
  const e = ui.ev;
  let h = '<div class="card"><h2>Step 3: Timeline of what went wrong</h2><p class="muted small">Pause the recording, type the time you see in the player, tap a chip and/or write a short note.</p>';

    '<div class="grow"><label class="f" for="evDriver">DSAT driver</label><select id="evDriver" data-ui="driver">' + driverOptions(e.driver, CHIPS.some(c => c.positive && c.label === e.chip)) + '</select></div></div>';
  h += '<label class="f">Quick chips</label><div class="chips">' + CHIPS.map(c => '<button class="chip' + (c.positive ? ' pos' : '') + (e.chip === c.label ? ' sel' : '') + '" data-act="chip" data-v="' + esc(c.label) + '" aria-pressed="' + (e.chip === c.label) + '">' + esc(c.label + (c.positive ? ' (positive)' : '')) + '</button>').join('') + '</div>';

  sortedEvents(cur).forEach(ev => {
    const i = cur.events.indexOf(ev);
    const badTs = !normTs(ev.ts);
    h += '<div class="ev ' + (ev.positive ? 'pos' : 'neg') + '"><div>' + txt('events.' + i + '.ts', ev.ts, {cls: badTs ? 'pii-bad' : '', a:{'aria-label':'Event time', 'data-rr':'1', inputmode:'numeric'}}) + '</div>' +
      '<div class="evbody"><div class="evlbl">' + (ev.chip ? esc(ev.chip) : '') + (ev.positive ? ' <span class="badge ok">Positive</span>' : '') + '</div>' +
      txt('events.' + i + '.note', ev.note, {a:{'aria-label':'Event note', placeholder:'Note'}}) +
      '<div class="evctl"><select data-bind="events.' + i + '.driver" aria-label="DSAT driver"' + (ev.positive ? ' disabled' : '') + '>' + driverOptions(ev.driver, ev.positive) + '</select>' +
      '<button class="btn sm danger" data-act="delEvent" data-id="' + ev.id + '">Delete</button></div></div></div>';
  });
  h += '</div>';
  return h;
}

function ynRow(key, val){
  const q = GATE1[key];
  return '<div class="q-row"><div class="qt">' + esc(q.text) + ' ' + tipBtn(q.tip, q.text) + '</div><div class="seg" role="group">' +
    ['yes','no'].map(v => '<button class="' + (val === v ? 'sel' : '') + '" data-act="gq" data-i="' + key + '" data-v="' + v + '" aria-pressed="' + (val === v) + '">' + (v === 'yes' ? 'Yes' : 'No') + '</button>').join('') + '</div></div>';
}
function evidenceList(role, list){
  if (!cur.events.length) return '<div class="notice warn">No timeline events yet. <button class="btn sm" data-act="goto" data-v="3">Add events in Step 3</button></div>';
  return sortedEvents(cur).map(e => {
    const on = list.includes(e.id);
    return '<button class="chk' + (on ? ' on' : '') + '" data-act="evid" data-i="' + role + '" data-id="' + e.id + '" aria-pressed="' + on + '"><span class="box">' + (on ? '&#10003;' : '') + '</span><span><b>' + esc(e.ts) + '</b> ' + esc(evLabel(e)) + ' <span class="muted small">' + esc(e.positive ? '[positive]' : e.driver ? '[' + e.driver + ']' : '') + '</span></span></button>';
  }).join('');
}
function subCards(act, type, sel){
  return '<div class="opts">' + SUBS[type].map(s => optCard(act, s.k, sel === s.k, s.k, s.d, s.tip, '<div class="q">Ask: ' + esc(s.q) + '</div>')).join('') + '</div>';
}
function step4(){
  const r = cur.rca, g = gate1(cur);
  let h = '<div class="card"><h2>Gate 1: Is the DSAT valid?</h2>';
  h += ynRow('q1', r.q1);
  if (r.q1 === 'yes') h += ynRow('q2', r.q2);
  if (r.q1 === 'yes' && r.q2 === 'no') h += ynRow('q3', r.q3);
  if (g.state === 'valid') {
    h += '<div class="notice ok">&#10003; DSAT is valid. Continue to Gate 2.</div>';
    if (g.review) h += '<div class="notice warn">&#9873; Flagged for review: correct outcome was given but the customer is still unhappy. Ask a reviewer to double-check validity.</div>';
  }
  if (g.state === 'nc') {
    h += '<div class="notice info"><b>Non-controllable.</b> ' + esc(g.why) + '. Pick a reason, then skip to the Summary.</div>';
    h += '<h3>Non-controllable reason</h3><div class="opts">' + NC_REASONS.map(n => optCard('ncReason', n.k, r.ncReason === n.k, n.k + (g.suggest === n.k ? ' (suggested)' : ''), '', n.tip)).join('') + '</div>';
    h += '<label class="f" for="f_ncn">Short note <span class="hint">(optional)</span></label>' + txt('rca.ncNote', r.ncNote, {a:{id:'f_ncn', placeholder:'e.g. Overdraft fee correctly applied per policy'}});
    h += '<div style="margin-top:10px"><button class="btn primary" data-act="goto" data-v="6">Skip to Summary &rarr;</button></div>';
  }
  h += '</div>';

  if (g.state === 'valid') {
    const {p, sec} = causeTypes(cur);
    const miss = hasVerifMiss(cur);
    h += '<div class="card"><h2>Gate 2: Would a fully trained, motivated advocate have avoided this DSAT?</h2>';
    if (miss) h += '<div class="notice warn">&#9888; A verification step was missed (' + esc(cur.verif.filter(v => v.status === 'missed').map(v => v.name).join(', ')) + '). This defaults to <b>Person</b> unless you choose Procedure gap or System and write a justification.</div>';
    h += '<div class="opts">' + G2.map(o => optCard('g2', o.k, r.g2 === o.k, o.t, o.d, o.tip)).join('') + '</div>';
    if (r.g2 === 'partly') {
      h += '<h3>Which cause is Primary?</h3><div class="opts">' + ['Person','Process'].map(t => optCard('ptype', t, r.primaryType === t, t + ' is Primary', 'Secondary will be ' + other(t), TYPE_TIPS[t])).join('') + '</div>';
    }
    h += '</div>';
    if (p) {
      h += '<div class="card"><h2>Gate 3: Primary cause - ' + esc(p) + '</h2><p class="muted small">Pick the sub-cause. Use the "Ask" question to test it.</p>';
      h += subCards('psub', p, r.pSub);
      h += '<label class="f" for="f_pex">Short explanation</label>' + txt('rca.pExplain', r.pExplain, {a:{id:'f_pex', placeholder:'e.g. Did not know the dispute timeline, gave wrong info'}});
      if (miss && p === 'Process') {
        h += '<label class="f" for="f_just">Justification: why is the verification miss a Process cause? <span class="hint">(required)</span></label>' + area('rca.justification', r.justification, {a:{id:'f_just', placeholder:'e.g. KB shows two conflicting verification flows for this call type'}});
      }
      h += '<h3 style="margin-top:14px">Evidence for Primary <span class="muted small">(link at least one timestamp)</span></h3>' + evidenceList('p', r.pEvidence);
      h += '</div>';
    }
    if (sec) {
      h += '<div class="card"><h2>Secondary cause - ' + esc(sec) + '</h2>';
      h += subCards('ssub', sec, r.sSub);
      h += '<label class="f" for="f_sex">Short explanation</label>' + txt('rca.sExplain', r.sExplain, {a:{id:'f_sex'}});
      h += '<h3 style="margin-top:14px">Evidence for Secondary <span class="muted small">(optional)</span></h3>' + evidenceList('s', r.sEvidence);
      h += '</div>';
    }
    h += '<div class="card"><details' + (r.whys.some(w => w) ? ' open' : '') + '><summary>5 Whys (optional)</summary><div class="whys">' +
      r.whys.map((w,i) => txt('rca.whys.' + i, w, {a:{'aria-label':'Why ' + (i+1), placeholder:'Why #' + (i+1)}})).join('') + '</div></details></div>';
  }
  const errs = step4Errors(cur);
  if (errs.length && g.state !== 'incomplete') h += '<div class="notice ' + (ui.showErr ? 'bad' : 'warn') + '" id="s4err"><b>Before you continue:</b><ul>' + errs.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul></div>';
  return h;
}

function step5(){
  const g = gate1(cur);
  let h = '<div class="card"><h2>Step 5: Action plan</h2>';
  if (g.state === 'nc') h += '<div class="notice info">This DSAT is Non-controllable, so no action is required. You can still add one (for example, VOC feedback).</div>';
  else if (step4Errors(cur).length) h += '<div class="notice warn">Finish the RCA in Step 4 to get suggested actions.</div>';
  else {
    ensureActions(cur);
    if (cur.actionsKey !== actionsKey(cur)) h += '<div class="notice warn">The RCA changed since these actions were written. <button class="btn sm" data-act="resetActions">Reset to suggested</button></div>';
    else h += '<p class="muted small">Suggested from your RCA. Edit anything. <button class="btn sm" data-act="resetActions">Reset to suggested</button></p>';
  }
  h += '<datalist id="owners">' + OWNERS.map(o => '<option value="' + esc(o) + '">').join('') + '</datalist>';
  cur.actions.forEach((a,i) => {
    h += '<div class="act"><div class="row" style="margin-bottom:6px"><b class="grow">' + esc(a.cause ? a.role + ': ' + a.cause : 'Custom action') + '</b><button class="btn sm danger" data-act="delAction" data-id="' + a.id + '">Delete</button></div>' +
      '<label class="f">Action</label>' + txt('actions.' + i + '.action', a.action) +
      '<div class="grid2"><div><label class="f">Owner</label>' + txt('actions.' + i + '.owner', a.owner, {a:{list:'owners'}}) + '</div>' +
      '<div><label class="f">Due date</label><input type="date" data-bind="actions.' + i + '.due" value="' + esc(a.due) + '"></div>' +
      '<div><label class="f">Status</label><div class="seg">' + ['Open','Done'].map(s => '<button class="' + (a.status === s ? 'sel' + (s === 'Done' ? ' ok' : '') : '') + '" data-act="actStatus" data-i="' + i + '" data-v="' + s + '" aria-pressed="' + (a.status === s) + '">' + s + '</button>').join('') + '</div></div></div></div>';
  });
  h += '<button class="btn" data-act="addAction">+ Add action</button></div>';
  return h;
}

function step6(){
  const g = gate1(cur);
  if (g.state !== 'nc' && !step4Errors(cur).length) ensureActions(cur);
  const pc = personCause(cur);
  if (pc && !cur.coaching.well && !cur.coaching.fix && !cur.coaching.tip) cur.coaching = coachingDefaults(cur);
  const errs = step1Errors(cur).concat(step4Errors(cur));
  let h = '';
  if (errs.length) h += '<div class="notice ' + (ui.showErr ? 'bad' : 'warn') + '"><b>Not finished yet:</b><ul>' + errs.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul></div>';
  h += '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Step 6: RCA summary</h2><button class="btn primary" data-act="copySummary">Copy summary</button></div>' +
    '<p class="muted small">Paste-ready. Updates from your answers in Steps 1-5.</p>' +
    '<textarea class="summary" id="summaryBox" readonly aria-label="RCA summary">' + esc(summaryText(cur)) + '</textarea></div>';
  if (pc) {
    h += '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Coaching note (' + esc(pc.sub) + ')</h2><button class="btn sm" data-act="regenCoach">Regenerate</button><button class="btn primary" data-act="copyCoach">Copy coaching note</button></div>' +
      '<label class="f" for="c_well">What went well</label>' + area('coaching.well', cur.coaching.well, {a:{id:'c_well', placeholder:'Tip: tag "Good handling" events in Step 3 to fill this in.'}}) +
      '<label class="f" for="c_fix">What to fix</label>' + area('coaching.fix', cur.coaching.fix, {a:{id:'c_fix'}}) +
      '<label class="f" for="c_tip">Tip for next call</label>' + area('coaching.tip', cur.coaching.tip, {a:{id:'c_tip'}}) + '</div>';
  }
  return h;
}

/* ================= Render: dashboard ================= */
function filtered(){
  const f = ui.filt;
  return DB.scrubs.filter(s => (!f.from || (s.date || '') >= f.from) && (!f.to || (s.date || '') <= f.to) && (!f.adv || s.advocate === f.adv));
}
function causesOf(s){
  const out = [];
  if (gate1(s).state !== 'valid') return out;
  const {p, sec} = causeTypes(s);
  if (p && s.rca.pSub) out.push({type:p, sub:s.rca.pSub, role:'Primary'});
  if (sec && s.rca.sSub) out.push({type:sec, sub:s.rca.sSub, role:'Secondary'});
  return out;
}
function hbar(items, title){
  const W = 320, rowH = 32, labW = 122, valW = 62, barMax = W - labW - valW;
  const max = Math.max(1, ...items.map(i => i.value));
  const H = items.length * rowH + 6;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(title) + '" style="max-width:480px;display:block">';
  items.forEach((it, i) => {
    const y = i * rowH + 4, w = it.value ? Math.max(4, it.value / max * barMax) : 0;
    s += '<g><title>' + esc(it.label + ': ' + it.value + (it.note ? ' (' + it.note + ')' : '')) + '</title>' +
      '<rect x="0" y="' + y + '" width="' + W + '" height="' + (rowH - 4) + '" fill="transparent"/>' +
      '<text x="' + (labW - 8) + '" y="' + (y + 19) + '" text-anchor="end" font-size="12">' + esc(it.label.length > 17 ? it.label.slice(0, 16) + '...' : it.label) + '</text>' +
      (w ? '<rect x="' + labW + '" y="' + (y + 5) + '" width="' + w.toFixed(1) + '" height="20" rx="4" style="fill:' + it.color + '"/>' : '') +
      '<text class="val" x="' + (labW + w + 6) + '" y="' + (y + 19) + '" font-size="12">' + it.value + (it.note ? ' (' + esc(it.note) + ')' : '') + '</text></g>';
  });
  s += '<line class="axis" x1="' + labW + '" x2="' + labW + '" y1="0" y2="' + H + '" stroke-width="1"/></svg>';
  return s;
}
const pctOf = (a, b) => b ? Math.round(a / b * 100) + '%' : '0%';
function repeatAlerts(){
  const since = addDays(today(), -13);
  const map = {};
  DB.scrubs.filter(s => (s.date || '') >= since && (s.date || '') <= today() && s.advocate).forEach(s => {
    causesOf(s).forEach(c => { const k = c.type + ' - ' + c.sub; (map[k] = map[k] || new Set()).add(s.advocate); });
  });
  const alerts = [], watch = [];
  Object.entries(map).forEach(([k, set]) => { if (set.size >= 3) alerts.push({k, advs:[...set]}); else if (set.size === 2) watch.push({k, advs:[...set]}); });
  return {alerts, watch};
}
function allAdvocates(){
  const set = new Set(DB.settings.advocates);
  DB.scrubs.forEach(s => s.advocate && set.add(s.advocate));
  return [...set].sort();
}
function renderDashboard(){

  const ra = repeatAlerts();
  if (ra.alerts.length) {
    h += '<div class="card alert-card"><h2 style="color:var(--bad)">&#9888; Repeat alert</h2>' + ra.alerts.map(a => '<div class="notice bad"><b>' + esc(a.k) + '</b> seen with ' + a.advs.length + ' different advocates in the last 14 days (' + esc(a.advs.join(', ')) + '). <b>Possible Training/Procedure gap, review with trainer.</b></div>').join('') + '<p class="muted small">Based on all scrubs from the last 14 days (filters not applied).</p></div>';
  } else {
    h += '<div class="card"><h2>Repeat alert</h2><p class="muted small">No sub-cause shared by 3+ different advocates in the last 14 days.</p>' +
      (ra.watch.length ? '<div class="notice warn">Watch: ' + ra.watch.map(w => esc(w.k) + ' (' + esc(w.advs.join(', ')) + ')').join('; ') + ' - one more advocate would trigger an alert.</div>' : '') + '</div>';
  }

  const cls = {Person:0, Process:0, 'Non-controllable':0, Undecided:0};
  list.forEach(s => cls[rcaClass(s)]++);
  const vr = list.map(verifResult).filter(v => ['PASS','PARTIAL','FAIL'].includes(v.code));
  const vc = {PASS:0, PARTIAL:0, FAIL:0}; vr.forEach(v => vc[v.code]++);
  const openActs = [];
  list.forEach(s => s.actions.forEach((a,i) => { if (a.status !== 'Done') openActs.push({s, a, i}); }));
  const total = list.length;
  h += '<div class="tiles">' +
    '<div class="tile"><div class="n">' + total + '</div><div class="l">Total scrubs</div></div>' +
    '<div class="tile"><div class="n">' + pctOf(vc.PASS, vr.length) + '</div><div class="l">Verification pass rate (' + vc.PASS + ' of ' + vr.length + ' checked)</div></div>' +
    '<div class="tile"><div class="n">' + pctOf(cls.Person, total) + '</div><div class="l">Person</div></div>' +
    '<div class="tile"><div class="n">' + pctOf(cls.Process, total) + '</div><div class="l">Process</div></div>' +
    '<div class="tile"><div class="n">' + pctOf(cls['Non-controllable'], total) + '</div><div class="l">Non-controllable</div></div>' +
    '<div class="tile"><div class="n">' + openActs.length + '</div><div class="l">Open actions</div></div></div>';

  if (!total) { h += '<div class="card muted">No scrubs in this view. Change the filters, or load sample data in Settings.</div>'; return h; }

  const split = [
    {label:'Person', value:cls.Person, color:'var(--person)', note:pctOf(cls.Person, total)},
    {label:'Process', value:cls.Process, color:'var(--process)', note:pctOf(cls.Process, total)},
    {label:'Non-controllable', value:cls['Non-controllable'], color:'var(--nc)', note:pctOf(cls['Non-controllable'], total)}
  ];
  if (cls.Undecided) split.push({label:'Undecided', value:cls.Undecided, color:'var(--undecided)', note:pctOf(cls.Undecided, total)});
  h += '<div class="card"><h2>Person vs Process vs Non-controllable</h2><p class="muted small">By Primary cause. Count (share of scrubs).</p>' + hbar(split, 'RCA split') + '</div>';

  const drv = {};
  list.forEach(s => { const seen = new Set(); s.events.forEach(e => { if (!e.positive && e.driver) seen.add(e.driver); }); seen.forEach(d => drv[d] = (drv[d] || 0) + 1); });
  const drvItems = Object.entries(drv).sort((a,b) => b[1] - a[1]).slice(0, 8).map(([k,v]) => ({label:k, value:v, color:'var(--driver)'}));
  h += '<div class="grid2"><div class="card"><h2>Top DSAT drivers</h2><p class="muted small">Number of scrubs with at least one timeline event tagged to the driver.</p>' + (drvItems.length ? hbar(drvItems, 'Top DSAT drivers') : '<p class="muted">No tagged events yet.</p>') + '</div>';

  const subs = {};
  list.forEach(s => causesOf(s).forEach(c => { const k = c.sub; subs[k] = subs[k] || {v:0, type:c.type}; subs[k].v++; }));
  const subItems = Object.entries(subs).sort((a,b) => b[1].v - a[1].v).map(([k,o]) => ({label:k, value:o.v, color: o.type === 'Person' ? 'var(--person)' : 'var(--process)'}));
  h += '<div class="card"><h2>Sub-causes</h2><p class="muted small">Primary + Secondary.</p>' + (subItems.length ? hbar(subItems, 'Sub-causes') + '<div class="legend"><span><i style="background:var(--person)"></i>Person</span><span><i style="background:var(--process)"></i>Process</span></div>' : '<p class="muted">No sub-causes yet.</p>') + '</div></div>';

  h += '<div class="card"><h2>Verification results</h2><div class="row"><span class="badge ok">PASS ' + vc.PASS + '</span><span class="badge warn">PARTIAL ' + vc.PARTIAL + '</span><span class="badge bad">FAIL ' + vc.FAIL + '</span>' + (total - vr.length ? '<span class="badge">Not finished ' + (total - vr.length) + '</span>' : '') + '</div></div>';

  // per advocate
  const per = {};
  list.forEach(s => {
    const a = s.advocate || '(none)';
    const o = per[a] = per[a] || {n:0, Person:0, Process:0, NC:0, fail:0, subs:{}, open:0};
    o.n++;
    const c = rcaClass(s); if (c === 'Person') o.Person++; else if (c === 'Process') o.Process++; else if (c === 'Non-controllable') o.NC++;
    if (verifResult(s).code === 'FAIL') o.fail++;
    causesOf(s).forEach(x => o.subs[x.sub] = (o.subs[x.sub] || 0) + 1);
    o.open += s.actions.filter(x => x.status !== 'Done').length;
  });
  h += '<div class="card"><h2>Per advocate</h2><div class="tbl-wrap"><table><thead><tr><th>Advocate</th><th>Scrubs</th><th>Person</th><th>Process</th><th>Non-ctrl</th><th>Verif FAIL</th><th>Repeat sub-causes</th><th>Open actions</th><th></th></tr></thead><tbody>' +
    Object.entries(per).sort((a,b) => b[1].n - a[1].n).map(([a,o]) => {
      const rep = Object.entries(o.subs).filter(([,n]) => n >= 2).map(([k,n]) => k + ' x' + n).join(', ');
      return '<tr><td><b>' + esc(a) + '</b></td><td>' + o.n + '</td><td>' + o.Person + '</td><td>' + o.Process + '</td><td>' + o.NC + '</td><td>' + o.fail + '</td><td>' + (rep ? '<span class="overdue">' + esc(rep) + '</span>' : '<span class="muted">-</span>') + '</td><td>' + o.open + '</td><td>' + (a !== '(none)' && f.adv !== a ? '<button class="btn sm" data-act="advView" data-v="' + esc(a) + '">View</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div></div>';

  if (f.adv) {
    const mine = list.slice().sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    h += '<div class="card"><h2>' + esc(f.adv) + ': scrubs</h2>' + mine.map(s => '<div class="hist"><div class="hh"><b>' + esc(s.date) + '</b> <span class="muted">' + esc(s.callRef) + '</span>' + verifBadge(s) + classBadge(s) + '</div><div class="hc">' + esc((s.comment || '').slice(0, 140)) + '</div><button class="btn sm" data-act="editScrub" data-id="' + s.id + '">Open</button></div>').join('') + '</div>';
    const mineOpen = openActs.filter(o => o.s.advocate === f.adv);
    h += '<div class="card"><h2>' + esc(f.adv) + ': open actions (' + mineOpen.length + ')</h2>' + (mineOpen.length ? mineOpen.map(o => '<div class="hist"><div class="hh"><b>' + esc(o.a.action) + '</b></div><div class="small">' + esc(o.a.owner || 'No owner') + ' | Due: <span class="' + (o.a.due && o.a.due < today() ? 'overdue' : '') + '">' + esc(o.a.due || '-') + (o.a.due && o.a.due < today() ? ' (overdue)' : '') + '</span> | Call ' + esc(o.s.callRef || '-') + ' on ' + esc(o.s.date) + '</div><div style="margin-top:6px"><button class="btn sm" data-act="markDone" data-id="' + o.s.id + '" data-i="' + o.i + '">Mark Done</button></div></div>').join('') : '<p class="muted">No open actions.</p>') + '</div>';
  }
  return h;
}

/* ================= Path helpers ================= */
function setPath(obj, path, val){
  const p = path.split('.'); let o = obj;
  for (let i = 0; i < p.length - 1; i++) { o = o[/^\d+$/.test(p[i]) ? +p[i] : p[i]]; if (o == null) return; }
  const last = p[p.length - 1];
  o[/^\d+$/.test(last) ? +last : last] = val;
}
function markPII(el){
  const bad = hasPII(el.value);
  el.classList.toggle('pii-bad', bad);
  let n = el.nextElementSibling;
  const hasMsg = n && n.classList.contains('pii-msg');
  if (bad && !hasMsg) el.insertAdjacentHTML('afterend', piiMsgHTML);
  if (!bad && hasMsg) n.remove();
  return bad;
}

/* ================= Navigation ================= */
function goStep(n){
  n = Math.max(1, Math.min(6, n));
  if (n === 5 && step <= 4 && gate1(cur).state !== 'nc' && step4Errors(cur).length) {
    step = 4; ui.showErr = true; render();
    const e = $('#s4err'); if (e) e.scrollIntoView({block:'center'});
    toast('Finish the RCA first (see the list)');
    return;
  }
  ui.showErr = false; step = n; render(); window.scrollTo(0, 0); saveCur();
}
function setView(v){ view = v; ui.settingsMsg = ''; render(); window.scrollTo(0, 0); }

/* ================= Save ================= */
function commitScrub(status){
  const bad = piiScan(cur);
  if (bad.length) { toast('Saving blocked: remove 6+ digit numbers from ' + bad.join(', '), 4500); updatePiiBar(); return false; }
  if (status === 'complete') {
    const errs = step1Errors(cur).concat(step4Errors(cur));
    if (errs.length) { ui.showErr = true; render(); toast('Not finished yet - see the list at the top', 3500); window.scrollTo(0, 0); return false; }
    if (gate1(cur).state !== 'nc') ensureActions(cur);
  }
  cur.status = status;
  cur.updatedAt = new Date().toISOString();
  const i = DB.scrubs.findIndex(s => s.id === cur.id);
  if (i >= 0) DB.scrubs[i] = clone(cur); else DB.scrubs.push(clone(cur));
  saveDB(); dirty = false; saveCur();
  render();
  toast(status === 'complete' ? 'Scrub saved as complete' : 'Draft saved');
  return true;
}
function startNew(force){
  if (!force && dirty && !confirm('Discard unsaved changes to the current scrub?')) return;
  cur = newScrub(); step = 1; dirty = false; ui.addingAdv = false; ui.ev = {ts:'', chip:'', note:'', driver:''}; ui.evErr = ''; ui.showErr = false;
  lsDel(LS_CUR); view = 'scrub'; render(); window.scrollTo(0, 0);
}

/* ================= Export / import ================= */
function csvCell(v){
  let s = String(v == null ? '' : v);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}
function exportCSV(){
  const head = ['Date','Advocate','Call ref','Call length','DSAT comment','Status','Sample','Verification','Verification detail','Valid','Non-controllable reason','Flagged for review','RCA class','Primary type','Primary sub-cause','Primary explanation','Secondary type','Secondary sub-cause','Secondary explanation','Verification justification','Evidence','Drivers','5 Whys','Actions','Open actions','Created','Updated','ID'];
  const rows = DB.scrubs.slice().sort((a,b) => (a.date || '').localeCompare(b.date || '')).map(s => {
    const g = gate1(s), {p, sec} = causeTypes(s), r = s.rca;
    const evIds = g.state === 'valid' ? liveEvidence(s, r.pEvidence).concat(liveEvidence(s, r.sEvidence).filter(id => !r.pEvidence.includes(id))) : [];
    const drivers = [...new Set(s.events.filter(e => !e.positive && e.driver).map(e => e.driver))];
    return [s.date, s.advocate, s.callRef, s.callLength, s.comment, s.status, s.sample ? 'Yes' : '', verifResult(s).code, verifDetail(s),
      g.state === 'valid' ? 'Yes' : g.state === 'nc' ? 'No' : '', g.state === 'nc' ? r.ncReason : '', g.state === 'valid' && g.review ? 'Yes' : '',
      rcaClass(s), g.state === 'valid' ? p : '', g.state === 'valid' ? r.pSub : '', g.state === 'valid' ? r.pExplain : '',
      g.state === 'valid' ? sec : '', g.state === 'valid' && sec ? r.sSub : '', g.state === 'valid' && sec ? r.sExplain : '', r.justification,
      evIds.map(id => evById(s, id)).filter(Boolean).map(evText).join('; '), drivers.join('; '),
      r.whys.filter(Boolean).join(' | '),
      s.actions.map(a => a.action + ' (' + a.owner + ', ' + a.due + ', ' + a.status + ')').join(' | '),
      s.actions.filter(a => a.status !== 'Done').length, s.createdAt, s.updatedAt, s.id];
  });
  const csv = '﻿' + [head].concat(rows).map(r => r.map(csvCell).join(',')).join('\r\n');
  download('dsat-scrubs-' + today() + '.csv', csv, 'text/csv;charset=utf-8');
  toast('CSV exported (' + rows.length + ' scrubs)');
}
function exportJSON(){
  const data = {app:'DSAT Scrub Assistant', version:1, exportedAt:new Date().toISOString(), settings:DB.settings, scrubs:DB.scrubs};
  download('dsat-scrub-backup-' + today() + '.json', JSON.stringify(data, null, 2), 'application/json');
  toast('JSON backup exported');
}
let importMode = 'merge';
function handleImport(file){
  const rd = new FileReader();
  rd.onload = () => {
    let o;
    try { o = JSON.parse(rd.result); } catch(e) { toast('That file is not valid JSON', 3500); return; }
    if (!o || !Array.isArray(o.scrubs)) { toast('Not a DSAT Scrub Assistant backup (no scrubs found)', 3500); return; }
    const scrubs = o.scrubs.map(normScrub);
    if (importMode === 'replace') {
      if (!confirm('Replace ALL current data with this backup (' + scrubs.length + ' scrubs)?')) return;
      DB = {app:'DSAT Scrub Assistant', version:1, settings: normSettings(o.settings), scrubs};
    } else {
      let added = 0, updated = 0;
      scrubs.forEach(s => { const i = DB.scrubs.findIndex(x => x.id === s.id); if (i >= 0) { DB.scrubs[i] = s; updated++; } else { DB.scrubs.push(s); added++; } });
      const st = normSettings(o.settings);
      st.advocates.forEach(a => { if (!DB.settings.advocates.includes(a)) DB.settings.advocates.push(a); });
      st.drivers.forEach(d => { if (!DB.settings.drivers.includes(d)) DB.settings.drivers.push(d); });
      saveDB(); render(); toast('Imported: ' + added + ' new, ' + updated + ' updated'); return;
    }
    saveDB(); render(); toast('Backup restored (' + scrubs.length + ' scrubs)');
  };
  rd.readAsText(file);
}

/* ================= Events ================= */
document.addEventListener('click', e => {
  const tip = e.target.closest('.tip');
  if (tip) { e.preventDefault(); e.stopPropagation(); showTip(tip); return; }
  hideTip();
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v, i = el.dataset.i, id = el.dataset.id;
  const r = cur && cur.rca;
  switch (act) {
    case 'view': setView(v); break;
    case 'goto': goStep(+v); break;
    case 'next': {
      if (step === 4 && gate1(cur).state === 'nc') { if (!r.ncReason) { ui.showErr = true; render(); toast('Pick a Non-controllable reason'); return; } goStep(6); }
      else goStep(step + 1);
      break;
    }
    case 'back': goStep(step === 6 && gate1(cur).state === 'nc' ? 4 : step - 1); break;
    case 'newScrub': startNew(false); break;
    case 'saveDraft': commitScrub(cur.status === 'complete' ? 'complete' : 'draft'); break;
    case 'finish': commitScrub('complete'); break;
    case 'addAdv': {
      const n = ui.newAdv.trim();
      if (!n) { toast('Type a name first'); return; }
      if (hasPII(n)) { toast('Remove the 6+ digit number from the name'); return; }
      if (!DB.settings.advocates.includes(n)) { DB.settings.advocates.push(n); saveDB(); }
      cur.advocate = n; ui.addingAdv = false; ui.newAdv = ''; touch(); render(); break;
    }
    case 'cancelAdv': ui.addingAdv = false; ui.newAdv = ''; render(); break;
    case 'vstat': { const s = cur.verif[+i]; s.status = s.status === v ? '' : v; touch(); render(); break; }
    case 'allDone': cur.verif.forEach(s => s.status = 'done'); touch(); render(); break;
    case 'reloadSteps': {
      if (cur.verif.some(s => s.status) && !confirm('Reload steps from Settings? Results already marked on this scrub will be cleared for renamed steps.')) return;
      const old = {}; cur.verif.forEach(s => old[s.name] = s);
      cur.verif = DB.settings.verifSteps.map(s => ({name:s.name, critical:!!s.critical, status: old[s.name] ? old[s.name].status : '', ts: old[s.name] ? old[s.name].ts : ''}));
      touch(); render(); break;
    }
    case 'chip': {
      const c = CHIPS.find(x => x.label === v);
      if (ui.ev.chip === v) { ui.ev.chip = ''; }
      else { ui.ev.chip = v; ui.ev.driver = c.positive ? '' : (DB.settings.drivers.includes(c.driver) ? c.driver : ui.ev.driver); }
      ui.evErr = ''; render(); break;
    }
    case 'addEvent': addEvent(); break;
    case 'delEvent': {
      cur.events = cur.events.filter(x => x.id !== id);
      r.pEvidence = r.pEvidence.filter(x => x !== id); r.sEvidence = r.sEvidence.filter(x => x !== id);
      touch(); render(); break;
    }
    case 'gq': {
      r[i] = v;
      if (i === 'q1' && v === 'no') { r.q2 = ''; r.q3 = ''; }
      if (i === 'q2' && v === 'yes') r.q3 = '';
      const g = gate1(cur);
      if (g.state === 'nc' && !r.ncReason) r.ncReason = g.suggest;
      if (g.state === 'valid' && !r.g2 && hasVerifMiss(cur)) { r.g2 = 'yes'; toast('Gate 2 pre-set to Person because a verification step was missed', 3500); }
      touch(); render(); break;
    }
    case 'ncReason': r.ncReason = v; touch(); render(); break;
    case 'g2': {
      r.g2 = v;
      const {p, sec} = causeTypes(cur);
      if (!SUBS[p] || !SUBS[p].some(s => s.k === r.pSub)) r.pSub = '';
      if (!sec || !SUBS[sec].some(s => s.k === r.sSub)) r.sSub = '';
      touch(); render(); break;
    }
    case 'ptype': {
      if (r.primaryType !== v) {
        // swap primary/secondary details when the primary side changes
        const oldP = {sub:r.pSub, ex:r.pExplain, ev:r.pEvidence};
        r.pSub = SUBS[v].some(s => s.k === r.sSub) ? r.sSub : ''; r.pExplain = r.sExplain; r.pEvidence = r.sEvidence;
        r.sSub = SUBS[other(v)].some(s => s.k === oldP.sub) ? oldP.sub : ''; r.sExplain = oldP.ex; r.sEvidence = oldP.ev;
        r.primaryType = v;
      }
      touch(); render(); break;
    }
    case 'psub': r.pSub = v; touch(); render(); break;
    case 'ssub': r.sSub = v; touch(); render(); break;
    case 'evid': {
      const key = i === 'p' ? 'pEvidence' : 'sEvidence';
      r[key] = r[key].includes(id) ? r[key].filter(x => x !== id) : r[key].concat(id);
      touch(); render(); break;
    }
    case 'resetActions': cur.actions = suggestActions(cur); cur.actionsKey = actionsKey(cur); touch(); render(); break;
    case 'addAction': cur.actions.push({id:uid(), role:'', cause:'', action:'', owner:'Mentor', due:addDays(today(), 7), status:'Open', auto:false, edited:true}); touch(); render(); break;
    case 'delAction': cur.actions = cur.actions.filter(a => a.id !== id); touch(); render(); break;
    case 'actStatus': cur.actions[+i].status = v; cur.actions[+i].edited = true; touch(); render(); break;
    case 'copySummary': copyText(summaryText(cur)); break;
    case 'copyCoach': copyText(coachingText(cur)); break;
    case 'regenCoach': cur.coaching = coachingDefaults(cur); touch(); render(); break;
    case 'editScrub': {
      if (dirty && cur && !confirm('Discard unsaved changes to the current scrub?')) return;
      const s = DB.scrubs.find(x => x.id === id); if (!s) return;
      cur = normScrub(clone(s)); step = 1; dirty = false; ui.showErr = false; view = 'scrub'; saveCur(); render(); window.scrollTo(0, 0); break;
    }
    case 'copyScrub': { const s = DB.scrubs.find(x => x.id === id); if (s) copyText(summaryText(s)); break; }
    case 'delScrub': {
      const s = DB.scrubs.find(x => x.id === id); if (!s) return;
      if (!confirm('Delete the scrub for ' + (s.advocate || 'unknown') + ' (' + (s.callRef || s.date) + ')? This cannot be undone.')) return;
      DB.scrubs = DB.scrubs.filter(x => x.id !== id); saveDB();
      if (cur && cur.id === id) { cur = newScrub(); step = 1; dirty = false; lsDel(LS_CUR); }
      render(); toast('Scrub deleted'); break;
    }
    case 'range': {
      if (v === 'clear') ui.filt = {from:'', to:'', adv:''};
      else if (v === '0') { ui.filt.from = ''; ui.filt.to = ''; }
      else { ui.filt.from = addDays(today(), -(+v - 1)); ui.filt.to = today(); }
      render(); break;
    }
    case 'advView': ui.filt.adv = v; render(); break;
    case 'markDone': {
      const s = DB.scrubs.find(x => x.id === id); if (!s) return;
      s.actions[+i].status = 'Done'; s.actions[+i].edited = true; s.updatedAt = new Date().toISOString(); saveDB();
      if (cur && cur.id === id) cur.actions = clone(s.actions);
      render(); toast('Action marked Done'); break;
    }
    case 'exportCSV': exportCSV(); break;
    case 'exportJSON': exportJSON(); break;
    case 'importJSON': importMode = v || 'merge'; $('#importFile').value = ''; $('#importFile').click(); break;
    case 'loadSample': loadSamples(); break;
    case 'clearSample': clearSamples(); break;
    case 'clearAll': {
      if (!confirm('Delete ALL scrubs and settings on this device? Export a backup first if you need one.')) return;
      if (!confirm('Are you sure? This cannot be undone.')) return;
      DB = defaultDB(); saveDB(); lsDel(LS_CUR); cur = newScrub(); step = 1; dirty = false; render(); toast('All data deleted'); break;
    }
    case 'sAdd': {
      const arr = DB.settings[v];
      if (v === 'verifSteps') arr.push({id:uid(), name:'Step ' + (arr.length + 1), critical:false});
      else arr.push(v === 'drivers' ? 'New driver' : 'New advocate');
      saveDB(); render();
      const inputs = document.querySelectorAll('[data-sbind^="' + v + '."]');
      const last = [...inputs].pop(); if (last) { last.focus(); last.select(); }
      break;
    }
    case 'sDel': {
      const arr = DB.settings[v];
      if (v === 'verifSteps' && arr.length === 1 && !confirm('Remove the last verification step?')) return;
      arr.splice(+i, 1); saveDB(); render(); break;
    }
    case 'sMove': { const arr = DB.settings[v], k = +i; if (k > 0) { [arr[k-1], arr[k]] = [arr[k], arr[k-1]]; saveDB(); render(); } break; }
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && (e.target.id === 'evNote' || e.target.id === 'evTs')) { e.preventDefault(); addEvent(); }
  if (e.key === 'Escape') hideTip();
});
function addEvent(){
  const f = ui.ev;
  const ts = normTs(f.ts);
  if (!ts) { ui.evErr = 'Enter the time as mm:ss (for example 03:15).'; render(); $('#evTs') && $('#evTs').focus(); return; }
  if (!f.chip && !f.note.trim()) { ui.evErr = 'Pick a chip or type a note.'; render(); return; }
  if (hasPII(f.note)) { ui.evErr = 'Remove the 6+ digit number from the note before adding.'; render(); return; }
  const c = CHIPS.find(x => x.label === f.chip);
  cur.events.push({id:uid(), ts, chip:f.chip, note:f.note.trim(), driver: c && c.positive ? '' : f.driver, positive: !!(c && c.positive)});
  ui.ev = {ts:'', chip:'', note:'', driver:''}; ui.evErr = '';
  touch(); render();
  const t = $('#evTs'); if (t) t.focus();
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.bind && cur && el.type !== 'checkbox') {
    setPath(cur, el.dataset.bind, el.value);
    if (/^actions\.\d+\./.test(el.dataset.bind)) cur.actions[+el.dataset.bind.split('.')[1]].edited = true;
    if (el.type === 'text' || el.tagName === 'TEXTAREA') markPII(el);
    updatePiiBar(); touch();
    return;
  }
  if (el.dataset.ui) {
    const k = el.dataset.ui;
    if (k === 'histQ') { ui.histQ = el.value; renderHistList(); return; }
    if (k === 'newAdv') { ui.newAdv = el.value; markPII(el); return; }
    ui.ev[k] = el.value;
    if (k === 'note') markPII(el);
    return;
  }
  if (el.dataset.sbind) {
    if (markPII(el)) { return; } // do not persist
    const val = el.value;
    const parts = el.dataset.sbind.split('.');
    if (parts[0] === 'verifSteps') DB.settings.verifSteps[+parts[1]].name = val;
    else DB.settings[parts[0]][+parts[1]] = val;
    saveDB();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'advSel') {
    if (el.value === '__new') { ui.addingAdv = true; render(); const n = document.querySelector('[data-ui="newAdv"]'); if (n) n.focus(); }
    else { cur.advocate = el.value; ui.addingAdv = false; touch(); render(); }
    return;
  }
  if (el.id === 'importFile') { if (el.files && el.files[0]) handleImport(el.files[0]); return; }
  if (el.dataset.bind && cur) {
    if (el.tagName === 'SELECT' || el.type === 'date') { setPath(cur, el.dataset.bind, el.value); touch(); }
    if (/\.ts$/.test(el.dataset.bind)) { const n = normTs(el.value); if (n) { el.value = n; setPath(cur, el.dataset.bind, n); touch(); } }
    if (el.dataset.rr || el.tagName === 'SELECT') render();
    return;
  }
  if (el.dataset.ui === 'driver') { ui.ev.driver = el.value; return; }
  if (el.dataset.filt) { ui.filt[el.dataset.filt] = el.value; render(); return; }
  if (el.dataset.scheck != null) { DB.settings.verifSteps[+el.dataset.scheck].critical = el.checked; saveDB(); return; }
  if (el.dataset.sbind) {
    if (hasPII(el.value)) { toast('Not saved: remove the 6+ digit number'); return; }
    const parts = el.dataset.sbind.split('.');
    if (parts[0] === 'advocates' || parts[0] === 'drivers') { DB.settings[parts[0]][+parts[1]] = el.value.trim(); saveDB(); }
  }
});

/* ================= Tooltips ================= */
const tipbox = $('#tipbox');
let tipFor = null;
let tipShownAt = 0;
function showTip(el){
  tipFor = el; tipShownAt = Date.now();
  tipbox.textContent = el.dataset.tip;
  tipbox.style.display = 'block';
  const r = el.getBoundingClientRect(), w = tipbox.offsetWidth, h = tipbox.offsetHeight;
  let left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
  tipbox.style.left = left + 'px'; tipbox.style.top = top + 'px';
}
function hideTip(){ tipbox.style.display = 'none'; tipFor = null; }
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('.tip'); if (t && t !== tipFor) showTip(t); });
document.addEventListener('mouseout', e => { const t = e.target.closest && e.target.closest('.tip'); if (t && !t.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('tip')) showTip(e.target); });
document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('tip')) hideTip(); });
window.addEventListener('scroll', () => { if (Date.now() - tipShownAt > 400) hideTip(); }, {passive:true});
window.addEventListener('beforeunload', () => { clearTimeout(curTimer); saveCur(); });

/* ================= Boot ================= */
loadDB();
(function restore(){
  const raw = lsGet(LS_CUR);
  if (raw) {
    try { const o = JSON.parse(raw); cur = normScrub(o.cur); step = o.step || 1; dirty = !!o.dirty; } catch(e) { cur = null; }
  }
  if (!cur) cur = newScrub();
  // test that storage really works
  if (!lsSet('dsatScrub.test', '1')) storageOK = false; else lsDel('dsatScrub.test');
})();
render();
</script>
